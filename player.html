<!--
UNIVERSAL PLAYER (Video.js primary, Clappr fallback)
===================================================

Purpose
-------
This page plays a single HLS stream (an .m3u8 URL) in a kiosk-friendly, full-bleed frame.
It tries Video.js first (generally more robust for long-running HLS), and if playback errors
or stalls, it automatically falls back to Clappr.

How you use it
--------------
1) Save this file as:
   /dv/player.html   (or another name, but update your wallboard URLs accordingly)

2) In your wallboard.html, each tile should iframe this player, passing the stream URL in
   the query string as a URL-encoded value:

   <iframe src="https://dmo18.github.io/dv/player.html?src=ENCODED_M3U8_URL&fit=contain&reload=60"></iframe>

3) IMPORTANT: The src= parameter MUST be URL-encoded.
   That means characters like ":" "/" "?" "&" must be encoded so they do not break the query string.

   Example encoding:
   https://example.com/live/master.m3u8
   becomes
   https%3A%2F%2Fexample.com%2Flive%2Fmaster.m3u8

How to URL-encode quickly
-------------------------
Option A (Chrome DevTools Console on any page):
  encodeURIComponent("https://example.com/live/master.m3u8")

Option B (Windows PowerShell):
  [uri]::EscapeDataString("https://example.com/live/master.m3u8")

Option C (Online encoder):
  Any URL encoder works. Encode ONLY the m3u8 URL that you put after src=

Supported Query Parameters
--------------------------
Required:
  src     URL-encoded HLS .m3u8 stream URL

Optional:
  fit     contain | cover
          contain = no cropping, may show black bars if aspect does not match the tile
          cover   = crop-fill, no bars, edges may be cut off

  controls 1 | 0
          1 = show play, volume and full screen controls (used by the encoder's Open button)
          0 = none (default, the wall)

  muted   1 | 0
          1 = muted (recommended for autoplay)
          0 = not muted (may require user gesture depending on browser policy)

  reload  number (minutes)
          0 = disable periodic reload
          60 = reload this tile every 60 minutes (helps long-run stability)

  ID      short name for the stream (no spaces). Not shown on screen.

  label   channel name to show in the corner of the tile and on the "No signal" card,
          e.g. label=BBC%20News. Leave it out for no label.

  alt     URL-encoded backup .m3u8 stream. Used when the main stream will not play.
          While the backup is showing, the main stream is checked every few minutes and
          the tile switches back when it returns.

  altlabel  channel name to show while the backup stream is playing.

  cc      1 | 0
          1 = show closed captions whenever the stream provides them (default)
          0 = never show captions
          Captions are drawn in one box near the bottom: text size follows the tile width
          (3.1% of it), never smaller than 12px and never larger than 31px. The box shows at
          most 2 lines; when the text is longer, the newest words (the last 2 lines) are shown.

Health report (diag)
--------------------
When this page runs inside a frame (a wallboard tile), it sends a message to the page around
it once every 5 seconds. The wallboard can use it for its check view (wallboard.html?diag=1).
Sent with window.parent.postMessage(msg, location.origin), so only a page on the same site
receives it. Opened on its own (no frame around it), the page sends nothing.
  {
    type:       "tilehealth"
    id:         the ID parameter ("" if not given)
    state:      "starting"  the current player has not shown a moving picture yet
                "playing"   the picture is moving (advanced in the last 2 seconds)
                "stalled"   the picture moved before but is frozen now, card not showing yet
                "nosignal"  the "No signal" card is showing, still trying
                "resting"   every option failed, waiting before starting over (card showing)
    w, h:       size of the video picture in pixels (0 if none yet)
    tileW, tileH: size of the tile in CSS pixels
    engine:     "vjs" (Video.js) or "clappr"
    alt:        true while the backup stream (alt=) is in use
    dropped:    dropped video frames in the last 5 seconds, percent, 0 to 100, 1 decimal
    stalls:     number of "waiting" or "stalled" video events since the page loaded, counted
                only once that video's picture has moved (start-up waits are not stalls)
    sinceStall: seconds since the last counted stall, or null if none yet
  }

Examples
--------
Example 1: Simple tile, keep full frame (no crop)
  https://dmo18.github.io/dv/player.html?src=https%3A%2F%2Fabcnews-streams.akamaized.net%2Fhls%2Flive%2F2023566%2Fabcnewshudson7%2Fmaster.m3u8&fit=contain

Example 2: Crop-fill to eliminate bars, reload every 45 minutes
  https://dmo18.github.io/dv/player.html?src=https%3A%2F%2Ffox-foxnewsnow-vizio.amagi.tv%2Fplaylist.m3u8&fit=cover&reload=45

Example 3: Unmuted (not recommended unless you need audio)
  https://dmo18.github.io/dv/player.html?src=https%3A%2F%2Fexample.com%2Flive%2Fmaster.m3u8&muted=0&fit=contain

Integrating with your URL-variable wallboard
--------------------------------------------
If your wallboard uses a URL map like:

  const URLS = {
    URL7: "https://dmo18.github.io/dv/player.html?src=ENCODED&fit=contain&reload=60"
  };

Then your tile can be:

  <iframe data-src="URL7"></iframe>

and your wallboard JS assigns iframe.src from URLS.

Notes / Troubleshooting
-----------------------
- If the stream is tokenized/signed, the .m3u8 may expire. When it expires, the player will fail
  and reload/fallback will not fix it; you must update the stream URL.
- Autoplay usually requires muted=1.
- If you see black bars:
  - Prefer fixing tile aspect ratio in wallboard, OR use fit=cover.
- If a stream fails in Video.js, this page automatically tries Clappr, then the backup
  stream (alt=) if one was given. If nothing plays, the tile shows a "No signal" card with
  the channel name and keeps retrying; the card disappears as soon as video is moving again.
- Picture quality is matched to the size of the tile: a small tile does not download
  1080p video it cannot show. This needs a stream address that offers several quality
  levels (a "master" playlist); an address locked to one quality level cannot be reduced.

                  Remote commands from the encoder's Play all / Pause all / Stop all buttons (postMessage type "tilectl",
                  cmd play | pause | stop). Paused and stopped tiles do not reload, restart or switch streams.
Rev10 2026-11-17  New option controls=1: shows the full player controls (play, volume, full screen) and turns
                  Clappr's own controls on. Default is unchanged (no controls), so the wall looks the same.

                  lighter box, so it takes less of the picture.

                  and Video.js. Captions at most 2 lines (newest shown), never under 12px.

                  state starting, playing, stalled, nosignal or resting; start-up waits are

                  watchdog that judges health by whether the picture is actually moving.
Rev4              Version as moved from the previous repository.

Versioning
----------
Update the <title> with Rev+1 each time you change this file.
-->

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

#vjsHost, #vjs, #clappr {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #000;
}

#clappr { display: none; }

.video-js,
.video-js .vjs-tech {
  width: 100% !important;
  height: 100% !important;
}

.video-js .vjs-tech,
#clappr video {
  object-fit: var(--fit, contain);
  background: #000;
}

/* Channel label, top-left of the tile */
#label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 92%;
  line-height: 1.25;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 20;
  display: none;
  padding: 0.2em 0.5em;
  font: 600 clamp(8px, 2.3vw, 14px) Arial, Helvetica, sans-serif;
  color: #fff;
  background: rgba(0, 0, 0, 0.45);
  border-bottom-right-radius: 0.3em;
  letter-spacing: 0.02em;
  pointer-events: none;
}

/* "No signal" card, shown instead of a black tile */
#offline {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5em;
  background: #101418;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
  pointer-events: none;
}
#offline .name { font-size: clamp(14px, 7vw, 48px); font-weight: 700; }
#offline .msg  { font-size: clamp(10px, 3.6vw, 24px); color: #9aa7b4; }

/* Closed captions: drawn by this page (not by Video.js), as one box centred near the bottom
   of the tile. The text size follows the tile width, so it stays readable in small tiles. */
#captions {
  position: fixed;
  left: 50%;
  bottom: 4%;
  transform: translateX(-50%);
  z-index: 15;
  display: none;
  width: max-content;
  max-width: 94%;
  box-sizing: border-box;
  padding: 0.15em 0.55em;
  font: 600 clamp(12px, 3.1vw, 31px)/1.3 Arial, Helvetica, sans-serif;
  /* at most 2 lines (2 x 1.3em plus the padding). The text sits at the bottom of the box and
     any extra lines are cut off at the top, so the newest words stay visible. */
  max-height: 2.9em;
  overflow: hidden;
  flex-direction: column;
  justify-content: flex-end;
  color: #fff;
  /* mostly transparent box; the dark outline keeps the white text readable on bright pictures */
  background: rgba(0, 0, 0, 0.2);
  text-shadow: 0 0 3px #000, 0 1px 3px #000, 0 0 7px rgba(0, 0, 0, 0.9);
  border-radius: 0.3em;
  text-align: center;
  pointer-events: none;
}

/* Kiosk: hide Video.js UI */
.vjs-text-track-display,   /* captions are drawn by this page instead, see #captions */
.vjs-modal-dialog {
  display: none !important;

html:not(.ctl) .vjs-big-play-button,

<body>
<div id="vjsHost"></div>
<div id="clappr"></div>
<div id="offline"><div class="name"></div><div class="msg">No signal. Retrying.</div></div>
<div id="label"></div>
<div id="captions"></div>

<script>
function param(name, def) {
  const u = new URL(location.href);
  return u.searchParams.get(name) ?? def;
}

const src = param("src", "");
if (!src) {
  document.body.innerHTML =
    "<div style='color:#fff;font:16px Arial;padding:12px'>" +
    "Missing required parameter: ?src= (URL-encoded .m3u8 URL)" +
    "</div>";
  throw new Error("Missing src");
}

const alt = param("alt", "");
const label = param("label", "");
const altLabel = param("altlabel", "") || label;

const fit = (param("fit", "contain") || "contain").toLowerCase();
document.documentElement.style.setProperty("--fit", fit === "cover" ? "cover" : "contain");

const muted = param("muted", "1") !== "0";
const withControls = param("controls", "0") === "1";
if (withControls) document.documentElement.classList.add("ctl");
const reloadMin = parseInt(param("reload", "0"), 10) || 0;
const showStatus = param("status", "1") !== "0";

/* -----------------------------
   Timing
   ----------------------------- */
const CHECK_MS = 3000;            /* how often the watchdog looks at the picture */
const CARD_AFTER_MS = 12000;      /* no moving picture for this long: show the card */
const GIVE_UP_MS = 25000;         /* no moving picture for this long: try the next option */
const REST_MS = 60000;            /* every option failed: wait this long, then start over */
const PRIMARY_PROBE_MS = 3 * 60 * 1000;  /* while on the backup, how often to check the main stream */

/* What to try, in order. Each option is a stream plus the player to play it with. */
/* With a backup, it is tried second, so a dead main stream is covered after one failed try. */
const ATTEMPTS = alt
  ? [{ url: src, engine: "vjs", isAlt: false }, { url: alt, engine: "vjs", isAlt: true },
     { url: src, engine: "clappr", isAlt: false }, { url: alt, engine: "clappr", isAlt: true }]
  : [{ url: src, engine: "vjs", isAlt: false }, { url: src, engine: "clappr", isAlt: false }];

let attempt = 0;
let vjsPlayer = null;
let clapprPlayer = null;
let lastTime = null;
let lastProgressAt = Date.now();
let resting = false;
let returnedByProbe = false;
let probeStrikes = 0;

const labelEl = document.getElementById("label");
const offlineEl = document.getElementById("offline");

function setLabel(text) {
  labelEl.textContent = text;
  labelEl.style.display = text ? "block" : "none";
}
/* Two-line tile label: name, then network status. Built with DOM nodes (no HTML from the page). */
function setStatusLabel(name, dot, status, detail) {
  labelEl.textContent = "";
  const top = document.createElement("div");
  top.textContent = name;
  const line = document.createElement("div");
  line.style.fontSize = "0.85em";
  line.style.opacity = "0.9";
  const d = document.createElement("span");
  d.textContent = "\u25cf ";
  d.style.color = dot;
  line.appendChild(d);
  line.appendChild(document.createTextNode(status + (detail ? " \u00b7 " + detail : "")));
  labelEl.appendChild(top);
  labelEl.appendChild(line);
  labelEl.style.display = "block";
}
function setCard(on) {
  offlineEl.querySelector(".name").textContent = label;
  offlineEl.querySelector(".msg").textContent = userState === "stopped" ? "Stopped" : "No signal. Retrying.";
  offlineEl.style.display = on ? "flex" : "none";
  if (on) setLabel("");
}

function destroyPlayers() {
  try { if (vjsPlayer) vjsPlayer.dispose(); } catch (e) {}
  vjsPlayer = null;
  try { if (clapprPlayer) clapprPlayer.destroy(); } catch (e) {}
  clapprPlayer = null;
  document.getElementById("vjsHost").innerHTML = "";
  document.getElementById("clappr").innerHTML = "";
  captionTrack = null;
  drawCaptions();
}

function startVjs(url) {
  document.getElementById("clappr").style.display = "none";

  /* Video.js removes its <video> element when disposed, so make a fresh one each time. */
  const v = document.createElement("video");
  v.id = "vjs";
  v.className = "video-js";
  v.muted = muted;
  v.autoplay = true;
  v.playsInline = true;
  document.getElementById("vjsHost").appendChild(v);

  vjsPlayer = videojs(v, {
    autoplay: true,
    muted: muted,
    controls: withControls,
    liveui: true,
    preload: "auto",
    /* match quality to the tile size, counting the screen's pixel density */
    html5: { vhs: { limitRenditionByPlayerDimensions: true, useDevicePixelRatio: true } },
    sources: [{ src: url, type: "application/x-mpegURL" }]
  });
  vjsPlayer.on("error", () => nextAttempt("player error"));
  setupCaptions(vjsPlayer);
}

/* Closed captions (Video.js).
   Many news streams carry captions either as a WebVTT track or inside the video (CEA-608/708).
   The player finds them once they start arriving, which can take a minute or two, so this keeps
   watching for new tracks. One caption track is followed (English preferred) and its text is
   drawn into #captions: one box, all current lines, always at the bottom of the tile. */
const captionsOn = param("cc", "1") !== "0";
const captionsEl = document.getElementById("captions");
let captionTrack = null;

function captionRank(t) {
  const name = String(t.id || t.label || "");
  let rank = t.kind === "subtitles" ? 0 : /^CC1$/i.test(name) ? 1 : /708|SERVICE1/i.test(name) ? 2 : 3;
  if (t.language && !/^(en|und)/i.test(t.language)) rank += 10;   /* other languages last */
  return rank;
}

/* cue text can contain WebVTT markup and entities: reduce it to plain text */
function plainText(html) {
  return (new DOMParser().parseFromString(html, "text/html").body.textContent || "").trim();
}

function drawCaptions() {
  let text = "";
  if (captionTrack && captionsOn) {
    const cues = Array.from(captionTrack.activeCues || []);
    /* 608 captions carry a row number; keep the lines in screen order */
    cues.sort((a, b) => (typeof a.line === "number" && typeof b.line === "number" ? a.line - b.line : 0) || a.startTime - b.startTime);
    text = cues.map((c) => plainText(c.text)).filter(Boolean).join(" ");
  }
  captionsEl.textContent = text;
  captionsEl.style.display = text ? "flex" : "none";   /* flex: see the 2-line rule in #captions */
}

function followCaptionTrack(player) {
  const tracks = Array.from(player.textTracks()).filter((t) => t.kind === "captions" || t.kind === "subtitles");
  tracks.sort((a, b) => captionRank(a) - captionRank(b));
  const best = tracks[0] || null;
  if (best === captionTrack) return;
  if (captionTrack) captionTrack.removeEventListener("cuechange", drawCaptions);
  captionTrack = best;
  /* "hidden": the cues still arrive and fire events, but Video.js does not draw them itself */
  tracks.forEach((t) => { t.mode = t === best && captionsOn ? "hidden" : "disabled"; });
  if (best) best.addEventListener("cuechange", drawCaptions);
  drawCaptions();
}

function setupCaptions(player) {
  captionTrack = null;
  drawCaptions();
  player.textTracks().addEventListener("addtrack", () => followCaptionTrack(player));
  followCaptionTrack(player);
}

function startClappr(url) {
  document.getElementById("clappr").style.display = "block";

  clapprPlayer = new Clappr.Player({
    source: url,
    parentId: "#clappr",
    autoPlay: true,
    mute: muted,
    chromeless: !withControls,
    loop: true,
    width: "100%",
    height: "100%",
    /* match quality to the tile size */
    playback: { playInline: true, hlsjsConfig: { capLevelToPlayerSize: true } }
  });
  if (clapprPlayer && clapprPlayer.on) {
    clapprPlayer.on(Clappr.Events.PLAYER_ERROR, () => nextAttempt("player error"));
  }
}

function start() {
  resting = false;
  destroyPlayers();
  lastTime = null;
  lastProgressAt = Date.now();
  const a = ATTEMPTS[attempt];
  try {
    if (a.engine === "vjs") startVjs(a.url); else startClappr(a.url);
  } catch (e) {
    nextAttempt("could not start");
  }
}

/* Move on to the next option. After the last one, show the card, rest, and start over. */
let switching = false;
function nextAttempt(why) {
  if (switching || resting) return;
  switching = true;
  setTimeout(() => {
    switching = false;
    attempt += 1;
    if (returnedByProbe && attempt < ATTEMPTS.length && ATTEMPTS[attempt].isAlt) {
      /* the main stream looked alive but would not play: count it, and stop asking after two */
      probeStrikes += 1;
      returnedByProbe = false;
    }
    if (attempt >= ATTEMPTS.length) {
      attempt = 0;
      resting = true;
      destroyPlayers();
      setCard(true);
      setTimeout(start, REST_MS);
      return;
    }
    start();
  }, 500);
}

/* Watchdog: the only test of health is whether the picture is actually moving. */
function currentVideo() {
  return Array.from(document.querySelectorAll("video")).find((v) => v.readyState >= 2) || null;
}

/* Remote control (from the encoder page): "live" plays normally, "paused" keeps the last picture,
   "stopped" releases the stream. While not live, nothing restarts the stream on its own. */
let userState = "live";
function setUserState(next) { userState = next; }
function applyCommand(cmd) {
  const v = currentVideo();
  if (cmd === "pause") {
    if (userState === "stopped") return;
    setUserState("paused");
    if (v) v.pause();
    if (clapprPlayer && clapprPlayer.pause) clapprPlayer.pause();
  } else if (cmd === "play") {
    if (userState === "stopped") { setUserState("live"); start(); return; }
    setUserState("live");
    lastProgressAt = Date.now();
    if (vjsPlayer && vjsPlayer.liveTracker) { try { vjsPlayer.liveTracker.seekToLiveEdge(); } catch (e) {} }
    if (v) v.play().catch(() => {});
    if (clapprPlayer && clapprPlayer.play) clapprPlayer.play();
  } else if (cmd === "stop") {
    setUserState("stopped");
    destroyPlayers();
    setCard(true);
  }
}
window.addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data || e.data.type !== "tilectl") return;
  applyCommand(String(e.data.cmd || ""));
});

/* Browser tab title and tile status, refreshed each second.
   Tab title: name, resolution, bitrate, "paused". Tile label: name, then network status. */
function statsText() {
  const v = currentVideo();
  const parts = [];
  if (v && v.videoHeight) parts.push(v.videoHeight + "p");
  const bw = bitrate();
  if (bw) parts.push((bw / 1e6).toFixed(1) + " Mb/s");
  return parts.join(" \u00b7 ");
}
function bitrate() {
  try {
    const vhs = vjsPlayer && vjsPlayer.tech && vjsPlayer.tech(true).vhs;
    return vhs && vhs.bandwidth ? vhs.bandwidth : 0;
  } catch (e) { return 0; }
}
function bufferSeconds() {
  const v = currentVideo();
  if (!v || !v.buffered || !v.buffered.length) return null;
  try { return Math.max(0, Math.round(v.buffered.end(v.buffered.length - 1) - v.currentTime)); } catch (e) { return null; }
}
setInterval(() => {
  const base = (ATTEMPTS[attempt] && ATTEMPTS[attempt].isAlt ? altLabel : label) || "";
  const live = userState === "live" && Date.now() - lastProgressAt < 5000;
  if (offlineEl.style.display === "flex" || resting) {
    document.title = base ? base + " \u00b7 no signal" : "Player";
    setLabel(base);
    return;
  }
  const stats = statsText();
  const buf = bufferSeconds();
  const detail = [stats, buf !== null && live ? buf + "s buffer" : ""].filter(Boolean).join(" \u00b7 ");
  if (userState === "paused") {
    document.title = [base, stats, "paused"].filter(Boolean).join(" \u00b7 ") || "Player";
    if (base) { if (showStatus) setStatusLabel(base, "#9aa3ad", "PAUSED", stats); else setLabel(base); }
  } else if (live) {
    document.title = [base, stats].filter(Boolean).join(" \u00b7 ") || "Player";
    if (base) { if (showStatus) setStatusLabel(base, "#3ddc84", "LIVE", detail); else setLabel(base); }
  } else if (userState === "live") {
    document.title = base || "Player";
    if (base) { if (showStatus) setStatusLabel(base, "#ffb000", "STARTING", ""); else setLabel(base); }
  }
}, 1000);

setInterval(() => {
  if (resting || userState !== "live") return;
  const v = currentVideo();
  const t = v ? v.currentTime : null;
  const now = Date.now();

  if (t !== null && lastTime !== null && t !== lastTime) {
    /* picture is moving */
    lastProgressAt = now;
    setCard(false);
    if (!ATTEMPTS[attempt].isAlt) returnedByProbe = false;
  }
  lastTime = t;

  const idle = now - lastProgressAt;
  /* Hold the card back while a backup is still waiting for its first try. */
  const backupUntried = alt && !ATTEMPTS.slice(0, attempt + 1).some((a) => a.isAlt);
  if (idle > CARD_AFTER_MS && !backupUntried) setCard(true);
  if (idle > GIVE_UP_MS) nextAttempt("no moving picture");
}, CHECK_MS);

/* While the backup is showing, quietly check whether the main stream is back.
   It counts as back when its playlist lists video segments. */
async function primaryIsBack() {
  const get = async (u) => {
    const r = await fetch(u, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  };
  try {
    let text = await get(src);
    if (!text.includes("#EXTINF")) {
      const variant = text.split("\n").map((l) => l.trim()).find((l) => l && !l.startsWith("#"));
      if (!variant) return false;
      text = await get(new URL(variant, src).href);
    }
    return text.includes("#EXTINF");
  } catch (e) {
    return false;
  }
}

if (alt) {
  setInterval(async () => {
    if (userState !== "live") return;                   /* paused or stopped by the encoder */
    if (!ATTEMPTS[attempt].isAlt && !resting) return;   /* already on the main stream */
    if (probeStrikes >= 2) return;                      /* wait for the periodic reload instead */
    if (await primaryIsBack()) {
      returnedByProbe = true;
      attempt = 0;
      start();
    }
  }, PRIMARY_PROBE_MS);
}

/* Health report to the wallboard, once every 5 seconds (see "Health report" at the top).
   Only reads the state above; it changes nothing. state may also be "paused" or "stopped" (encoder controls). Sent only when this page is in a frame. */
if (window.parent && window.parent !== window) {
  const tileId = String(param("ID", "")).slice(0, 40);
  const MOVING_MS = 2000;            /* picture advanced within this time: "playing" */
  let stalls = 0;
  let lastStallAt = null;
  /* For each <video>: its first seen time position, and when its picture last advanced.
     A video that has never advanced is still starting; its waiting events are not stalls. */
  const firstTime = new WeakMap();
  const lastAdvance = new WeakMap();
  const lastSeen = new WeakMap();
  const countStall = (e) => {
    if (!lastAdvance.has(e.target)) return;   /* not moving yet: start-up, not a stall */
    stalls += 1; lastStallAt = Date.now();
  };
  /* media events do not bubble, so listen in the capture phase to catch every <video> */
  document.addEventListener("timeupdate", (e) => {
    const v = e.target, t = v.currentTime;
    if (!firstTime.has(v)) firstTime.set(v, t);
    if (t !== firstTime.get(v) && t !== lastSeen.get(v)) lastAdvance.set(v, Date.now());
    lastSeen.set(v, t);
  }, true);
  document.addEventListener("waiting", countStall, true);
  document.addEventListener("stalled", countStall, true);

  let prevVideo = null, prevDropped = 0, prevTotal = 0;
  setInterval(() => {
    try {
      const v = currentVideo();
      let dropped = 0;
      if (v && v.getVideoPlaybackQuality) {
        const q = v.getVideoPlaybackQuality();
        const dT = q.totalVideoFrames - prevTotal, dD = q.droppedVideoFrames - prevDropped;
        if (v === prevVideo && dT > 0 && dD >= 0) dropped = Math.min(100, Math.round((dD / dT) * 1000) / 10);
        prevVideo = v; prevDropped = q.droppedVideoFrames; prevTotal = q.totalVideoFrames;
      } else {
        prevVideo = null; prevDropped = 0; prevTotal = 0;
      }
      const a = ATTEMPTS[attempt] || ATTEMPTS[0];
      const advancedAt = v ? lastAdvance.get(v) : undefined;
      const state = userState !== "live" ? userState
        : resting ? "resting"
        : offlineEl.style.display === "flex" ? "nosignal"
        : advancedAt === undefined ? "starting"
        : Date.now() - advancedAt <= MOVING_MS ? "playing" : "stalled";
      window.parent.postMessage({
        type: "tilehealth",
        id: tileId,
        state: state,
        w: v ? v.videoWidth : 0,
        h: v ? v.videoHeight : 0,
        tileW: window.innerWidth,
        tileH: window.innerHeight,
        engine: a.engine,
        alt: !!a.isAlt,
        dropped: dropped,
        stalls: stalls,
        sinceStall: lastStallAt === null ? null : Math.round((Date.now() - lastStallAt) / 1000)
      }, location.origin);
    } catch (e) { /* never let the report disturb playback */ }
  }, 5000);
}

start();

if (reloadMin > 0) {
  /* a paused or stopped tile waits for its next turn rather than restarting */
  const reloadWhenLive = () => (userState === "live" ? location.reload() : setTimeout(reloadWhenLive, 30000));
  setTimeout(reloadWhenLive, reloadMin * 60 * 1000);
}
</script>

</body>
</html>
