name: Fire TV lab test

# firetv-lab-test.yml Rev 1 (2026-11-18)
# Builds the Fire TV app, starts a virtual Android TV (1080p), installs the app, starts it, presses remote
# buttons (Up for channel up, Menu for the guide, Back to close it), takes a screenshot after each step, and
# publishes the screenshots, the log and the tested install file as the release "firetv-lab".
# Run by hand from the Actions tab. Uses only the built-in GitHub token.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the app
        working-directory: firetv
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "9d926787066a081739e8200858338b4a69e837c3a821a33aca9db09dd4a41026  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.5/bin/gradle" --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/lab"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/lab/rmtv.apk"

      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create the virtual Android TV
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list 2>/dev/null | grep -E 'system-images;android-(28|30);' | head -20 || true
          IMAGE="system-images;android-30;android-tv;x86"
          sdkmanager "platform-tools" "emulator" "$IMAGE" || { IMAGE="system-images;android-30;google_apis;x86_64"; sdkmanager "$IMAGE"; }
          echo "image: $IMAGE" | tee lab/log.txt
          echo "no" | avdmanager create avd -n tv -k "$IMAGE" --device "tv_1080p" --force
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Start the virtual TV and test the app
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          nohup emulator -avd tv -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 3 > lab/emulator.txt 2>&1 &
          adb wait-for-device
          for i in $(seq 1 80); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          echo "boot completed: $(adb shell getprop sys.boot_completed | tr -d '\r')" | tee -a lab/log.txt
          echo "android: $(adb shell getprop ro.build.version.release | tr -d '\r') (api $(adb shell getprop ro.build.version.sdk | tr -d '\r'))" | tee -a lab/log.txt
          adb shell input keyevent KEYCODE_HOME
          sleep 5
          shot() { adb exec-out screencap -p > "lab/$1.png"; }
          adb install -r lab/rmtv.apk | tee -a lab/log.txt
          adb shell am start -n com.redmachodevil.tv/.MainActivity | tee -a lab/log.txt
          sleep 60;  shot step1-start
          echo "running after start: $(adb shell pidof com.redmachodevil.tv | tr -d '\r')" | tee -a lab/log.txt
          adb shell input keyevent KEYCODE_DPAD_UP
          sleep 25;  shot step2-channel-up
          adb shell input keyevent KEYCODE_MENU
          sleep 5;   shot step3-guide-open
          adb shell input keyevent KEYCODE_DPAD_DOWN
          sleep 2;   shot step4-guide-down
          adb shell input keyevent KEYCODE_BACK
          sleep 5;   shot step5-back-closes-guide
          adb shell input keyevent KEYCODE_MEDIA_PLAY_PAUSE
          sleep 3;   shot step6-mute
          echo "running at end: $(adb shell pidof com.redmachodevil.tv | tr -d '\r')" | tee -a lab/log.txt
          adb logcat -d -v brief 2>/dev/null | grep -iE 'redmacho|AndroidRuntime|chromium.*(ERROR|FATAL)|FATAL' | tail -60 > lab/app-log.txt || true
          adb emu kill || true

      - name: Publish the lab results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view firetv-lab --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create firetv-lab --repo "$GITHUB_REPOSITORY" --title "Fire TV lab test results" \
              --notes "Screenshots, log and the tested install file from the Fire TV lab test workflow."
          gh release upload firetv-lab lab/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Results: https://github.com/$GITHUB_REPOSITORY/releases/tag/firetv-lab"
