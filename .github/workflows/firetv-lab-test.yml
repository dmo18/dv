name: Fire TV lab test

# firetv-lab-test.yml Rev 7 (2026-11-19)
# - Rev 7: tests app 1.1 and TV Rev12: Back closes the guide, then hides the overlay, then leaves the app; Skip off air
#   stays lit and channel up jumps over off-air channels; the overlay hides by itself after 15 s. Old files in the
#   release are removed before the new ones are uploaded.
# - Rev 6 2026-11-18
# - Rev 6: longer waits after a channel change (the virtual TV starts streams slowly); the Play/Pause check is its own
#   step (mute, screenshot, unmute) before the channel 20 playback check.
# - Rev 5 2026-11-18
# - Rev 5: adds a playback check: switch to channel 20 (BBC News, moving picture) and take two screenshots 8 seconds apart.
# - Rev 4 2026-11-18
# - Rev 4: screenshots are taken on the device and pulled (an empty one no longer stops the upload); each file is uploaded on
#   its own; the web view (browser engine) version is logged; a screenshot after the app starts itself and one after Down.
# - Rev 3 2026-11-18
# - Rev 3: uses a standard Android 11 image (google_apis, 1080p TV screen profile). The Android TV image refuses adb
#   connections ("device unauthorized"), so nothing could be installed. App and remote key handling are the same.
# - Rev 2 2026-11-18
# - Rev 2: the virtual TV is stored in a fixed folder (ANDROID_AVD_HOME) so the emulator finds it; waits have time limits.
# - Rev 1: first version.
# Builds the Fire TV app, starts a virtual Android TV (1080p), installs the app, starts it, presses remote
# buttons (Up for channel up, Menu for the guide, Back to close it), takes a screenshot after each step, and
# publishes the screenshots, the log and the tested install file as the release "firetv-lab".
# Run by hand from the Actions tab. Uses only the built-in GitHub token.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the app
        working-directory: firetv
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "9d926787066a081739e8200858338b4a69e837c3a821a33aca9db09dd4a41026  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.5/bin/gradle" --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/lab"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/lab/rmtv.apk"

      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create the virtual Android TV
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list 2>/dev/null | grep -E 'system-images;android-(28|30);' | head -20 || true
          IMAGE="system-images;android-30;google_apis;x86_64"
          sdkmanager "platform-tools" "emulator" "$IMAGE"
          echo "image: $IMAGE" | tee lab/log.txt
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd -n tv -k "$IMAGE" --device "tv_1080p" --force
          emulator -list-avds | tee -a lab/log.txt
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Start the virtual TV and test the app
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          emulator -list-avds | tee -a lab/log.txt
          nohup emulator -avd tv -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 3 > lab/emulator.txt 2>&1 &
          sleep 20
          if ! pgrep -f "qemu-system" >/dev/null; then echo "emulator did not start:"; cat lab/emulator.txt; exit 1; fi
          timeout 300 adb wait-for-device || { echo "no device after 300 s"; tail -30 lab/emulator.txt; exit 1; }
          for i in $(seq 1 80); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          echo "boot completed: $(adb shell getprop sys.boot_completed | tr -d '\r')" | tee -a lab/log.txt
          echo "android: $(adb shell getprop ro.build.version.release | tr -d '\r') (api $(adb shell getprop ro.build.version.sdk | tr -d '\r'))" | tee -a lab/log.txt
          adb shell input keyevent KEYCODE_HOME
          sleep 5
          shot() { adb shell screencap -p /sdcard/lab.png; adb pull /sdcard/lab.png "lab/$1.png" >/dev/null 2>&1 || true; [ -s "lab/$1.png" ] || { sleep 3; adb shell screencap -p /sdcard/lab.png; adb pull /sdcard/lab.png "lab/$1.png" >/dev/null 2>&1 || true; }; }
          echo "web view: $(adb shell dumpsys webviewupdate | grep -iE 'Current WebView package|versionName' | tr -d '\r' | tr '\n' ' ')" | tee -a lab/log.txt
          adb shell dumpsys package com.google.android.webview | grep -m1 versionName | tee -a lab/log.txt || true
          adb install -r lab/rmtv.apk | tee -a lab/log.txt
          adb shell am start -n com.redmachodevil.tv/.MainActivity | tee -a lab/log.txt
          sleep 60;  shot s01-start
          echo "running after start: $(adb shell pidof com.redmachodevil.tv | tr -d '\r')" | tee -a lab/log.txt
          adb shell input keyevent KEYCODE_DPAD_UP
          sleep 40;  shot s02-channel-up
          adb shell input keyevent KEYCODE_MENU
          sleep 4;   shot s03-guide-open
          adb shell input keyevent KEYCODE_BACK
          sleep 3;   shot s04-back-closes-guide
          adb shell input keyevent KEYCODE_BACK
          sleep 3;   shot s05-back-hides-overlay
          echo "running after two Backs: $(adb shell pidof com.redmachodevil.tv | tr -d '\r')" | tee -a lab/log.txt
          adb shell input text s
          sleep 3;   shot s06-skip-on
          adb shell input keyevent KEYCODE_DPAD_UP
          sleep 4;   shot s07-skip-channel-up
          sleep 17;  shot s08-hidden-after-15s
          adb shell input keyevent KEYCODE_BACK
          sleep 4
          echo "running after third Back (empty = app closed): '$(adb shell pidof com.redmachodevil.tv | tr -d '\r')'" | tee -a lab/log.txt
          adb shell am start -n com.redmachodevil.tv/.MainActivity | tee -a lab/log.txt
          sleep 40
          adb shell input text 20
          adb shell input keyevent KEYCODE_ENTER
          sleep 60;  shot s09-channel20-a
          sleep 10;  shot s10-channel20-b
          echo "running at end: $(adb shell pidof com.redmachodevil.tv | tr -d '\r')" | tee -a lab/log.txt
          adb logcat -d -v brief 2>/dev/null | grep -iE 'redmacho|AndroidRuntime|chromium.*(ERROR|FATAL)|FATAL' | tail -60 > lab/app-log.txt || true
          adb emu kill || true

      - name: Publish the lab results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view firetv-lab --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create firetv-lab --repo "$GITHUB_REPOSITORY" --title "Fire TV lab test results" \
              --notes "Screenshots, log and the tested install file from the Fire TV lab test workflow."
          for a in $(gh release view firetv-lab --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            gh release delete-asset firetv-lab "$a" --repo "$GITHUB_REPOSITORY" -y || true
          done
          for f in lab/*; do
            if [ -s "$f" ]; then gh release upload firetv-lab "$f" --repo "$GITHUB_REPOSITORY" --clobber || echo "could not upload $f"; else echo "skipped empty file $f"; fi
          done
          echo "Results: https://github.com/$GITHUB_REPOSITORY/releases/tag/firetv-lab"
