name: Build Fire TV app

# firetv-build.yml Rev 1 (2026-11-18)
# Builds the Red Macho Devil TV app for Fire TV (a full-screen web view of tv.html) and publishes it as the
# release "firetv" (file RedMachoDevilTV.apk), at a fixed address you can type into the Downloader app:
#   https://github.com/dmo18/dv/releases/download/firetv/RedMachoDevilTV.apk
# Run by hand from the Actions tab (Run workflow). The app only opens the live site, so it rarely needs a rebuild.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the app
        working-directory: firetv
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "9d926787066a081739e8200858338b4a69e837c3a821a33aca9db09dd4a41026  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.5/bin/gradle" --no-daemon --stacktrace assembleDebug
          ls -la app/build/outputs/apk/debug/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp firetv/app/build/outputs/apk/debug/app-debug.apk RedMachoDevilTV.apk
          gh release view firetv --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create firetv --repo "$GITHUB_REPOSITORY" \
              --title "Red Macho Devil TV for Fire TV" \
              --notes "Install file for Fire TV. See docs/FIRETV.md. For educational purposes only."
          gh release upload firetv RedMachoDevilTV.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/download/firetv/RedMachoDevilTV.apk"
