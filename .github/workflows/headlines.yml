name: Update headlines

# Fetches the news feeds for headlines.html and publishes them as headlines.json on the
# "headlines-data" branch. That branch holds a single commit that is replaced on every
# run, so it adds no history to main and does not trigger a Pages rebuild.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - headlines-feeds.json
      - .github/scripts/fetch_headlines.py
      - .github/workflows/headlines.yml

permissions:
  contents: write

concurrency:
  group: headlines
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds
        run: |
          mkdir out
          python3 .github/scripts/fetch_headlines.py headlines-feeds.json out/headlines.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/headlines-data/headlines.json"

      - name: Publish to headlines-data branch
        run: |
          cd out
          git init -q -b headlines-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add headlines.json
          git commit -q -m "Update headlines"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" headlines-data
