<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Headlines Rev12</title>
<!--
  VERSION: bump the Rev number in the <title> above on every change to this file,
  and add a line here (newest first).

  Rev12  2026-11-13  Redesigned so the ticker never waits on the network: it starts from the last
                     headlines saved in the browser, fetches updates in the background and swaps
                     them in between passes. Removed all timeouts, relay services and the
                     "Refreshing" state. Feed list moved to headlines-feeds.json. Page reloads
                     itself when a new Rev is published.
  Rev11  2026-11-13  Headlines now come from headlines.json, which a scheduled GitHub workflow
                     builds from the FEEDS list (the relay services the page relied on had
                     stopped working). Fixed the YWN, Middle East Eye, Times of Israel and
                     AP feed addresses.
  Rev10              Version as moved from the previous repository (earlier history not recorded).
-->

<style>
:root{
  --fontSize: 38px;
  --sourceSize: 18px;
  --timeSize: 14px;
  --gap: 30px;
  --dotSize: 8px;
  --padX: 14px;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.bar {
  height: 100%;
  width: 100%;
  display: flex;
  align-items: center;
  background: #000;
  color: #fff;
}

.track {
  position: relative;
  flex: 1 1 auto;
  height: 100%;
  display: flex;
  align-items: center;
  overflow: hidden;
  padding: 0 var(--padX);
  box-sizing: border-box;
}

/* Marquee container that we translate */
.marquee {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  will-change: transform;
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
}

/* Two identical runs placed side by side */
.run {
  display: inline-flex;
  align-items: center;
  gap: var(--gap);
  white-space: nowrap;
}

/* Small spacer between run1 and run2 to prevent seam overlap */
.runSpacer {
  width: var(--gap);
  flex: 0 0 auto;
}

.item {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}

.dot {
  width: var(--dotSize);
  height: var(--dotSize);
  border-radius: 50%;
  background: #1f6feb;
  flex: 0 0 auto;
}

.sourceBlock {
  display: flex;
  flex-direction: column;
  line-height: 1;
  margin-right: 6px;
}

.source {
  color: #cdd5df;
  font-weight: 800;
  font-size: var(--sourceSize);
  line-height: 1;
}

.time {
  color: #7f8a96;
  font-weight: 650;
  font-size: var(--timeSize);
  line-height: 1;
  margin-top: 2px;
}

.title {
  color: #ffffff;
  font-weight: 650;
  font-size: var(--fontSize);
}

.status {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: flex-start;
  padding: 0 var(--padX);
  color: #f0f0f0;
  font-size: calc(var(--fontSize) - 12px);
  pointer-events: none;
}

a { color: inherit; text-decoration: none; }
</style>
</head>

<body>
<div class="bar">
  <div class="track">
    <div id="status" class="status">Loading...</div>

    <!-- Marquee structure: two runs so we never rely on scrollWidth/2 -->
    <div id="marquee" class="marquee" aria-label="Headlines ticker">
      <div id="run1" class="run"></div>
      <div class="runSpacer" aria-hidden="true"></div>
      <div id="run2" class="run" aria-hidden="true"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   Headlines Rev12

   Design: the ticker never waits on the network.

   - A scheduled GitHub workflow ("Update headlines") collects the feeds listed in
     headlines-feeds.json and publishes them as one file, headlines.json.
   - This page keeps the last headlines it received in the browser's storage and
     starts scrolling them the moment it loads.
   - New headlines are fetched in the background. The ticker keeps scrolling while
     that happens, and swaps the new set in at the end of a pass.
   - If a fetch is slow or fails, nothing changes on screen: the current headlines
     keep scrolling and the page simply tries again later. There are no timeouts,
     no relay services and no "Refreshing" state.
*/

/* -----------------------------
   Tuning
   ----------------------------- */
const SPEED_PX_PER_SEC = 65;
const PER_FEED_MAX = 4;
const MAX_ITEMS = 40;
const CHECK_MINUTES = 5;         /* how often to look for a newer headlines.json */
const RETRY_SECONDS = 30;        /* how soon to look again after a failed fetch */

const CACHE_KEY = "headlines_cache_v2";

/* DOM refs */
const statusEl = document.getElementById("status");
const marqueeEl = document.getElementById("marquee");
const run1El = document.getElementById("run1");
const run2El = document.getElementById("run2");

/* The status line is only ever visible before the very first headlines arrive. */
function showStatus(msg) {
  statusEl.style.display = "flex";
  statusEl.textContent = msg;
}
function hideStatus() {
  statusEl.style.display = "none";
}

/* Where the workflow publishes the headlines */
function publishedUrl() {
  let owner = "dmo18", repo = "dv";
  if (location.hostname.endsWith(".github.io")) {
    owner = location.hostname.split(".")[0];
    repo = location.pathname.split("/").filter(Boolean)[0] || repo;
  }
  return "https://raw.githubusercontent.com/" + owner + "/" + repo + "/headlines-data/headlines.json";
}

/* Helpers */
function safeTime(s) {
  const t = Date.parse(s);
  return Number.isFinite(t) ? t : 0;
}

/* Timestamp: "Thu 15:07" */
function formatStamp(pubDate) {
  const t = safeTime(pubDate);
  if (!t) return "";
  const d = new Date(t);
  const dow = d.toLocaleDateString([], { weekday: "short" });
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return dow + " " + hh + ":" + mm;
}

/* Pick what to show: newest first, at most PER_FEED_MAX per source, MAX_ITEMS in all */
function selectItems(all) {
  const count = {};
  const seen = new Set();
  const out = [];
  const sorted = all.slice().sort((a, b) => safeTime(b.pubDate) - safeTime(a.pubDate));
  for (const it of sorted) {
    if (!it || !it.title || !it.link) continue;
    const key = it.title.toLowerCase().replace(/\s+/g, " ").trim();
    if (seen.has(key)) continue;
    count[it.source] = (count[it.source] || 0) + 1;
    if (count[it.source] > PER_FEED_MAX) continue;
    seen.add(key);
    out.push(it);
    if (out.length >= MAX_ITEMS) break;
  }
  return out;
}

/* Local copy of the last headlines received */
function saveCache(generated, items) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ generated, items })); } catch (e) {}
}
function loadCache() {
  try {
    const obj = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    return obj && Array.isArray(obj.items) && obj.items.length ? obj : null;
  } catch (e) {
    return null;
  }
}

/* Build one run (run1), then clone into run2 as siblings */
function buildRuns(items) {
  run1El.innerHTML = "";
  run2El.innerHTML = "";

  for (const h of items) {
    const item = document.createElement("span");
    item.className = "item";

    const dot = document.createElement("span");
    dot.className = "dot";

    const sourceBlock = document.createElement("span");
    sourceBlock.className = "sourceBlock";

    const src = document.createElement("span");
    src.className = "source";
    src.textContent = h.source;

    const time = document.createElement("span");
    time.className = "time";
    time.textContent = formatStamp(h.pubDate);

    sourceBlock.appendChild(src);
    if (time.textContent) sourceBlock.appendChild(time);

    const a = document.createElement("a");
    a.href = h.link;
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    const title = document.createElement("span");
    title.className = "title";
    title.textContent = h.title;

    a.appendChild(title);

    item.appendChild(dot);
    item.appendChild(sourceBlock);
    item.appendChild(a);

    run1El.appendChild(item);
  }

  /* Clone run1 into run2 */
  run2El.appendChild(run1El.cloneNode(true));
}

/* -----------------------------
   Ticker
   ----------------------------- */
let shownGenerated = 0;   /* "generated" stamp of the set on screen */
let pending = null;       /* newer set waiting for the end of the current pass */
let x = 0;
let lastTs = null;
let cycleWidth = 0;
let running = false;

function measureCycleWidth() {
  const spacer = marqueeEl.querySelector(".runSpacer");
  const spacerW = spacer ? spacer.getBoundingClientRect().width : 0;
  cycleWidth = run1El.getBoundingClientRect().width + spacerW;
}

/* Put a set on screen. Only called at a pass boundary (x === 0) or before the first pass. */
function show(set) {
  buildRuns(set.items);
  shownGenerated = set.generated;
  x = 0;
  marqueeEl.style.transform = "translateY(-50%) translateX(0px)";
  measureCycleWidth();
  hideStatus();
  if (!running) {
    running = true;
    requestAnimationFrame(step);
  }
}

function step(ts) {
  if (lastTs == null) lastTs = ts;
  /* cap the step so a background tab coming back does not jump */
  const dt = Math.min((ts - lastTs) / 1000, 0.1);
  lastTs = ts;

  if (cycleWidth > 10) {
    x -= SPEED_PX_PER_SEC * dt;
    if (x <= -cycleWidth) {
      x = 0;
      if (pending) {              /* swap in newer headlines between passes */
        const next = pending;
        pending = null;
        show(next);
      }
    }
    marqueeEl.style.transform = "translateY(-50%) translateX(" + x + "px)";
  }
  requestAnimationFrame(step);
}

/* Fonts loading late or a resize changes the width of a pass */
window.addEventListener("resize", measureCycleWidth);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureCycleWidth);

/* -----------------------------
   Background updates
   ----------------------------- */
let fetching = false;

async function checkForUpdate() {
  if (fetching) return;           /* a slow request is simply left to finish */
  fetching = true;
  let ok = false;
  try {
    const res = await fetch(publishedUrl(), { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      const items = selectItems(Array.isArray(data.items) ? data.items : []);
      const generated = data.generated || 0;
      ok = true;
      if (items.length && generated > shownGenerated) {
        const set = { generated, items };
        saveCache(generated, items);
        if (running) pending = set; else show(set);
      }
    }
  } catch (e) {
    /* offline, blocked or bad data: keep showing what we have */
  } finally {
    fetching = false;
    setTimeout(checkForUpdate, ok ? CHECK_MINUTES * 60 * 1000 : RETRY_SECONDS * 1000);
  }
}

/* Start: show the saved headlines at once, then look for newer ones in the background */
const cached = loadCache();
if (cached) show(cached); else showStatus("Loading headlines");
checkForUpdate();

/* Self-update: every 5 minutes, reload if a newer Rev of this page has been published */
const versionOf = (text) => (text.match(/<title>[^<]*\bRev(\d+)/i) || [])[1];
const RUNNING_REV = versionOf("<title>" + document.title);
setInterval(async () => {
  try {
    const r = await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const latest = versionOf(await r.text());
    if (latest && RUNNING_REV && latest !== RUNNING_REV) location.reload();
  } catch (e) { /* try again next time */ }
}, 5 * 60 * 1000);
</script>
</body>
</html>
