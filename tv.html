<!--
  TV PAGE (framework). Full-screen channel changer built on player.html.
  Rev1  2026-11-17  First version: channel guide with descriptions, change channel (arrows, Page Up/Down, number keys,
                    swipe on phones, or tap in the guide), last channel remembered on this device, tap once to start sound.
                    Channels are the encoder's list (copied in below; regenerate when the encoder list changes).
                    EPG hook: set window.EPG = { "<channel name>": "what is on now" } in a script to show it in the guide.
                    Real programme schedules are NOT included yet.
  Rev2  2026-11-17  Theme: Red Macho Devil TV. Black and blood red, flame edges, bold caps, pulsing devil-horn start screen,
                    brand bar on screen, guide with flame header, live channel badge.
  Rev3  2026-11-17  Controls bar: channel down and up, guide, volume slider, mute, info. Now-playing line with the
                    channel's description. Browser tab title shows the channel. Keys: arrows, Page Up/Down, digits, G, M,
                    +/- for volume. Volume is set on the player's own video element (same site).
  Rule: every address here must also be in encoder.html (see CLAUDE.md).
-->
<style>
:root { --bg:#000; --panel:#0c0606; --fg:#fff3f0; --dim:#c9a7a2; --red:#e10600; --red2:#7a0000; --gold:#ffb000; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
#screen { position:fixed; inset:0; width:100%; height:100%; border:0; background:#000; }
/* flame edge: a moving red-orange-black band along the top of the picture */
#flame { position:fixed; left:0; right:0; top:0; height:10px; pointer-events:none; z-index:3;
  background:linear-gradient(90deg,#7a0000,#e10600,#ff4d00,#ffb000,#e10600,#7a0000,#e10600,#ff4d00,#7a0000);
  background-size:200% 100%; animation:flow 2.5s linear infinite; box-shadow:0 0 18px #e10600; }
@keyframes flow { to { background-position:-200% 0; } }
#brand { position:fixed; left:14px; top:22px; z-index:3; font-weight:900; font-style:italic; text-transform:uppercase;
  letter-spacing:.04em; font-size:clamp(14px,2.2vw,22px); color:var(--fg); text-shadow:0 2px 0 var(--red2),0 0 14px rgba(225,6,0,.8);
  opacity:0; transition:opacity .4s ease; pointer-events:none; }
#brand.show { opacity:1; }
#brand span { color:var(--red); }
#osd { position:fixed; left:16px; bottom:16px; padding:8px 14px 8px 10px; border-left:6px solid var(--red);
  background:linear-gradient(90deg,rgba(122,0,0,.9),rgba(0,0,0,.75)); text-transform:uppercase; font-weight:800;
  font-size:clamp(14px,2.4vw,20px); opacity:0; transition:opacity .4s ease; pointer-events:none; }
#osd.show { opacity:1; }
#osd .num { color:var(--gold); font-weight:900; margin-right:10px; font-size:1.3em; }
#start { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  background:radial-gradient(circle at center,rgba(122,0,0,.85) 0%,#000 70%); border:0; color:var(--fg); cursor:pointer; }
#start .horns { width:clamp(90px,14vw,160px); fill:var(--red); filter:drop-shadow(0 0 16px var(--red)); animation:pulse 1.4s ease-in-out infinite; }
#start .big { font-size:clamp(28px,6vw,64px); font-weight:900; font-style:italic; text-transform:uppercase; letter-spacing:.03em;
  text-shadow:0 4px 0 var(--red2); }
#start .sub { font-size:clamp(13px,2vw,18px); color:var(--dim); text-transform:uppercase; letter-spacing:.2em; }
@keyframes pulse { 50% { transform:scale(1.08); filter:drop-shadow(0 0 30px var(--red)); } }
#bar { position:fixed; right:12px; bottom:12px; z-index:4; display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;
  max-width:calc(100vw - 24px); padding:8px; border-radius:10px; background:rgba(10,0,0,.8); border:1px solid #5a0000; }
#bar button, #bar select { min-height:42px; min-width:42px; padding:0 12px; border:0; border-radius:6px; background:#2a0606; color:var(--fg);
  font-weight:900; font-size:16px; cursor:pointer; }
#bar button:hover { background:#5a0000; }
#bar input[type=range] { width:clamp(90px,16vw,160px); accent-color:var(--red); }
#now { position:fixed; left:14px; top:50px; z-index:3; max-width:min(560px,calc(100vw - 28px)); padding:8px 12px; border-radius:8px;
  background:rgba(0,0,0,.6); border-left:4px solid var(--gold); font-size:14px; color:var(--dim); opacity:0; transition:opacity .4s ease; pointer-events:none; }
#now.show { opacity:1; }
#now b { color:var(--fg); text-transform:uppercase; letter-spacing:.03em; }
#guideBtn { min-height:46px; padding:0 20px; border:0; border-radius:6px;
  background:linear-gradient(180deg,#ff1a10,#a00000); color:#fff; font-weight:900; font-size:16px; text-transform:uppercase;
  letter-spacing:.06em; box-shadow:0 0 16px rgba(225,6,0,.6); cursor:pointer; }
#guide { position:fixed; left:0; right:0; bottom:0; z-index:6; max-height:66vh; display:flex; flex-direction:column;
  background:var(--panel); border-top:5px solid var(--red); box-shadow:0 -10px 40px rgba(225,6,0,.45);
  transform:translateY(100%); transition:transform .3s ease; }
#guide.open { transform:translateY(0); }
#guide header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px;
  background:linear-gradient(90deg,#e10600,#7a0000); }
#guide header b { font-size:20px; font-weight:900; font-style:italic; text-transform:uppercase; letter-spacing:.05em; }
#guide header button { min-height:40px; padding:0 14px; border:2px solid #000; border-radius:6px; background:#000; color:var(--fg);
  font-size:14px; font-weight:800; text-transform:uppercase; cursor:pointer; }
#list { overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 0 18px; }
.row { display:grid; grid-template-columns:52px 1fr; gap:4px 12px; padding:10px 16px; border:0; width:100%; text-align:left;
  background:none; color:var(--fg); cursor:pointer; transition:background .15s ease; }
.row { border-bottom:1px solid #2a0c0c; }
.row:hover, .row:focus-visible { background:#1f0505; outline:none; box-shadow:inset 6px 0 0 var(--red); }
.row.on { background:linear-gradient(90deg,#5c0000,#1a0404); box-shadow:inset 6px 0 0 var(--gold); }
.row .n { grid-row:span 2; font-weight:900; font-style:italic; color:var(--gold); font-size:20px; padding-top:2px; }
.row .t { font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:.02em; }
.row .d { font-size:13px; color:var(--dim); line-height:1.35; }
.row.off .t::after { content:"  off air"; color:var(--gold); font-weight:700; font-size:11px; letter-spacing:.1em; }
.now { font-size:12px; color:#ff8a80; font-weight:700; }
</style>

<div id="flame" aria-hidden="true"></div>
<iframe id="screen" allow="autoplay; fullscreen" title="Channel"></iframe>

  <button id="mute" type="button" aria-label="Mute">Mute</button>
  <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
  <button id="info" type="button">Info</button>
  <button id="guideBtn" type="button">Guide</button>
</div>

<section id="guide" aria-label="Channel guide">
  <header><b>Red Macho Devil TV</b><button id="closeGuide" type="button">Close</button></header>

</section>

/* EPG hook: { "<channel name>": "what is on now" }. Empty until a schedule source is added. */
window.EPG = window.EPG || {};

const $ = (id) => document.getElementById(id);
const screen_ = $("screen"), osd = $("osd"), guide = $("guide"), list = $("list");
const KEY = "tv.lastChannel";
let current = 0, typed = "", typeTimer = null, osdTimer = null, nowTimer = null, started = false;

function playerUrl(ch) {
  const p = new URLSearchParams({ ID: ch.name.replace(/\s+/g, ""), src: ch.url, fit: "contain", muted: "0", controls: "0", cc: "1", reload: "0" });
  return "player.html?" + p.toString();
}

function tune(i, { quiet = false } = {}) {
  if (!CHANNELS.length) return;
  current = ((i % CHANNELS.length) + CHANNELS.length) % CHANNELS.length;
  const ch = CHANNELS[current];
  if (started) screen_.src = playerUrl(ch);   /* sound needs a tap first, so nothing loads before it */
  try { localStorage.setItem(KEY, String(current)); } catch (e) {}
  const now = window.EPG[ch.name];
  osd.innerHTML = '<span class="num">' + (current + 1) + '</span>' + ch.name + (now ? '<div class="now">' + now + '</div>' : "");
  $("now").innerHTML = '<b>' + (current + 1) + ' ' + ch.name + '</b>' + (ch.off ? ' (off air right now)' : '') + '<br>' + (now ? 'Now: ' + now + '<br>' : '') + ch.desc;
  document.title = (current + 1) + " " + ch.name + " | Red Macho Devil TV";
  if (!quiet) { flashOsd(); showNow(); }
  applyVolume();
  document.querySelectorAll(".row").forEach((r, k) => r.classList.toggle("on", k === current));
}
function showNow() {
  $("now").classList.add("show");
  clearTimeout(nowTimer);
  nowTimer = setTimeout(() => $("now").classList.remove("show"), 6000);
}
/* the player's videos live inside the iframe (same site), so the volume is set on them */
function videos() {
  try { return Array.from(screen_.contentDocument ? screen_.contentDocument.querySelectorAll("video") : []); } catch (e) { return []; }
}
let volume = 1, muted = false;
function applyVolume() {
  videos().forEach((v) => { v.volume = volume; v.muted = muted; });
  $("mute").textContent = muted ? "Unmute" : "Mute";
}
function setVolume(v) {
  volume = Math.min(1, Math.max(0, v));
  if (volume > 0) muted = false;
  $("vol").value = volume;
  applyVolume();
}
function toggleMute() { muted = !muted; applyVolume(); }
function flashOsd() {
  osd.classList.add("show");
  $("brand").classList.add("show");
  clearTimeout(osdTimer);
  osdTimer = setTimeout(() => { osd.classList.remove("show"); $("brand").classList.remove("show"); }, 3000);
}

function buildGuide() {
  list.innerHTML = "";
  CHANNELS.forEach((ch, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "row" + (ch.off ? " off" : "");
    b.innerHTML = '<span class="n"></span><span class="t"></span><span class="d"></span>';
    b.querySelector(".n").textContent = i + 1;
    b.querySelector(".t").textContent = ch.name;
    const now = window.EPG[ch.name];
    b.querySelector(".d").textContent = (now ? "Now: " + now + ". " : "") + ch.desc;
    b.addEventListener("click", () => { tune(i); closeGuide(); });
    list.appendChild(b);
  });
  document.querySelectorAll(".row").forEach((r, k) => r.classList.toggle("on", k === current));
}
function openGuide() { guide.classList.add("open"); const on = list.querySelector(".row.on"); if (on) on.scrollIntoView({ block: "center" }); }
function closeGuide() { guide.classList.remove("open"); }

$("guideBtn").addEventListener("click", () => (guide.classList.contains("open") ? closeGuide() : openGuide()));
$("chUp").addEventListener("click", () => tune(current + 1));
$("chDown").addEventListener("click", () => tune(current - 1));
$("mute").addEventListener("click", toggleMute);
$("vol").addEventListener("input", (e) => setVolume(parseFloat(e.target.value)));
$("info").addEventListener("click", showNow);
screen_.addEventListener("load", applyVolume);
setInterval(applyVolume, 1500);
$("closeGuide").addEventListener("click", closeGuide);
$("start").addEventListener("click", () => { started = true; $("start").style.display = "none"; tune(current); });

/* keyboard: arrows or Page Up/Down change channel, G toggles the guide, digits type a channel number */
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowUp" || e.key === "PageUp") { tune(current - 1); e.preventDefault(); }
  else if (e.key === "ArrowDown" || e.key === "PageDown") { tune(current + 1); e.preventDefault(); }
  else if (e.key === "g" || e.key === "G") { guide.classList.contains("open") ? closeGuide() : openGuide(); }
  else if (e.key === "Escape") { closeGuide(); }
  else if (e.key === "m" || e.key === "M") { toggleMute(); }
  else if (e.key === "+" || e.key === "=") { setVolume(volume + 0.1); }
  else if (e.key === "-") { setVolume(volume - 0.1); }
  else if (e.key === "i" || e.key === "I") { showNow(); }
  else if (/^[0-9]$/.test(e.key)) {
    typed += e.key;
    clearTimeout(typeTimer);
    typeTimer = setTimeout(() => { const n = parseInt(typed, 10); typed = ""; if (n >= 1 && n <= CHANNELS.length) tune(n - 1); }, 900);
  }
});

/* swipe up or down on a phone to change channel */
let touchY = null;
document.addEventListener("touchstart", (e) => { touchY = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (touchY === null || guide.classList.contains("open")) return;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dy) > 60) tune(current + (dy < 0 ? 1 : -1));
  touchY = null;
});

/* start: ?ch=<number> wins, else the last channel on this device, else the first */
(function init() {
  const q = parseInt(new URLSearchParams(location.search).get("ch"), 10);
  let start = 0;
  try { start = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) {}
  if (q >= 1 && q <= CHANNELS.length) start = q - 1;
  buildGuide();
  tune(start, { quiet: true });
})();
</script>
