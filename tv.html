<title>Red Macho Devil TV Rev15</title>
<!--
  RED MACHO DEVIL TV (framework). Full-screen channel changer built on player.html.
  Rev15 2026-11-19  The second Back to leave may come up to 4 seconds after the first (was 3).
  Rev14 2026-11-19  Top bar fits a 960 px wide TV page: brand and clock stay on one line, the stats line is tighter.
  Rev13 2026-11-19  The overlay hides after 5 seconds. Leaving the Fire TV app takes two Back presses: with nothing on screen,
                    Back shows "Press Back again to exit" and only a second press within 3 seconds leaves. Volume controls are
                    back in a normal browser and hidden only inside the Fire TV app (which says so in its user agent). The top
                    bar shows network and stream stats while it is visible: picture size, the stream's own bitrate, the
                    measured download speed, seconds buffered, dropped frames and the network type.
  Rev12 2026-11-19  One bottom panel instead of two overlapping overlays: the channel banner sits above a single row of buttons
                    and the channel name is no longer shown twice. Volume controls removed (use the TV remote's own volume).
                    The red top bar fades with the overlay. Back (needs app 1.1) closes the guide, then hides the overlay,
                    then leaves. Skip off air is now an on/off setting that stays on: channel up and down jump over off-air
                    channels while it is lit. The version shows next to the educational note. Player links carry the version
                    so an old cached player is not reused.
  Rev11 2026-11-19  The whole overlay (top bar, banner, bottom bar) hides after 15 seconds without a button press and comes back on
                    any press. Remote control: Left and Right now step through the bottom buttons by our own rule (the volume
                    slider used to trap the focus, so Info, Guide and Full could not be reached), Select presses the lit button,
                    Vol - and Vol + buttons replace the slider for remotes, Info switches the channel banner on and off, and
                    Skip off air says which channel it jumped to. In the guide, Left and Right switch All / On air.
  Rev10 2026-11-18  Closing the guide takes the focus off the hidden list (the lab test showed Select re-tuned a channel after Back).
  Rev9  2026-11-18  The selected row in the guide is clearly highlighted (found in the Fire TV lab test).
  Rev8  2026-11-18  Works in older web views (found in the Fire TV lab test): no "inset" shorthand (the start screen was squeezed
                    into a corner), and no selector lists that include :focus-visible (an old engine drops the whole rule).
  Rev7  2026-11-18  For the Fire TV app and any remote control: a clear gold outline on whichever button is selected, and while the
                    guide is open the up and down arrows move through the guide instead of changing channel.
  Rev6  2026-11-18  Removed the separate Fox News audio (Rev5 change reverted).
  Rev4  2026-11-17  Devil logo (start screen, brand). Bottom bar: channel down/up, skip off air, last channel, CC, mute,
                    volume, guide, fullscreen, info. Top bar with clock and date, status light (LIVE, CONNECTING,
                    NO SIGNAL, OFF AIR). Now-playing banner with the channel description. Guide with All / On air tabs.
                    Keys: arrows or Page Up/Down, digits then Enter, S skip off air, L last channel, C CC, M mute,
                    +/- volume, G guide, I info, F fullscreen. Channels copied from encoder.html (keep in step).
                    EPG hook: window.EPG = { "<channel name>": "what is on now" } shows in the banner and guide.
                    Real programme schedules are NOT included yet.
  Rule: every address here must also be in encoder.html (see CLAUDE.md).
-->
<style>
:root { --bg:#000; --panel:#0c0606; --fg:#fff3f0; --dim:#c9a7a2; --red:#e10600; --red2:#7a0000; --gold:#ffb000; --good:#3ddc84; --warn:#ffb000; --bad:#ff4d4d; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
button { font-family:inherit; }
#screen { position:fixed; top:0; right:0; bottom:0; left:0; width:100%; height:100%; border:0; background:#000; }
#flame { position:fixed; left:0; right:0; top:0; height:8px; z-index:3; pointer-events:none;
  background:linear-gradient(90deg,#7a0000,#e10600,#ff4d00,#ffb000,#e10600,#7a0000,#e10600,#ff4d00,#7a0000);
  background-size:200% 100%; animation:flow 2.5s linear infinite; box-shadow:0 0 18px #e10600; }
@keyframes flow { to { background-position:-200% 0; } }

/* top bar: brand, clock, status light. Shows with the info banner and on any key or tap. */
#top { position:fixed; left:0; right:0; top:8px; z-index:4; display:flex; align-items:center; gap:12px; padding:8px 14px;
  background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0)); transition:opacity .4s ease; }
#top.hide { opacity:0; pointer-events:none; }
/* whole overlay hidden after 15 s without input (class set on body) */
#dock, #top, #flame { transition:opacity .5s ease; }
body.hideui #dock, body.hideui #top, body.hideui #flame { opacity:0 !important; pointer-events:none; }
body.hideui { cursor:none; }
#top .devil { width:38px; height:38px; flex:none; filter:drop-shadow(0 0 8px var(--red)); }
#brand { font-weight:900; font-style:italic; text-transform:uppercase; letter-spacing:.04em; font-size:clamp(14px,2vw,20px); text-shadow:0 2px 0 var(--red2); }
#brand span { color:var(--red); }
#stats { flex:1 1 auto; min-width:0; font:600 10px/1.3 ui-monospace,Consolas,monospace; color:var(--dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#toast { position:fixed; left:50%; bottom:40%; transform:translateX(-50%); z-index:9; padding:12px 20px; border-radius:8px;
  background:rgba(0,0,0,.85); border:2px solid var(--red); color:var(--fg); font-weight:900; font-size:18px; display:none; }
#toast.show { display:block; }
#bar input[type=range] { width:clamp(70px,10vw,130px); accent-color:var(--red); }
body.app .volctl { display:none !important; }
#brand, #clock, #status { white-space:nowrap; flex:none; }
#clock { margin-left:auto; font-variant-numeric:tabular-nums; font-weight:800; font-size:clamp(14px,2vw,20px); }
#clock small { display:block; font-size:11px; font-weight:600; color:var(--dim); text-align:right; }
#status { display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:6px; background:#000; border:1px solid #3a0a0a;
  font-size:12px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; }
#status i { width:10px; height:10px; border-radius:50%; background:var(--warn); display:inline-block; }
#status.live i { background:var(--good); box-shadow:0 0 8px var(--good); }
#status.nosig i, #status.off i { background:var(--bad); }
#status.off i { background:var(--gold); }

/* start screen */
#start { position:fixed; top:0; right:0; bottom:0; left:0; width:100%; height:100%; z-index:9; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  background:radial-gradient(circle at center,rgba(122,0,0,.85) 0%,#000 70%); border:0; color:var(--fg); cursor:pointer; }
#start .devil { width:clamp(120px,22vw,220px); filter:drop-shadow(0 0 22px var(--red)); animation:pulse 1.4s ease-in-out infinite; }
#start .big { font-size:clamp(28px,6vw,64px); font-weight:900; font-style:italic; text-transform:uppercase; letter-spacing:.03em; text-shadow:0 4px 0 var(--red2); }
#start .sub { font-size:clamp(13px,2vw,18px); color:var(--dim); text-transform:uppercase; letter-spacing:.2em; }
@keyframes pulse { 50% { transform:scale(1.07); } }

/* bottom panel: the channel banner above one row of buttons, then the note and version */
#dock { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; flex-direction:column; gap:6px;
  padding:10px 10px calc(6px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,rgba(0,0,0,.95) 55%,rgba(0,0,0,0)); }
#osd { display:none; align-self:flex-start; max-width:min(720px,100%); padding:8px 14px 8px 12px;
  border-left:6px solid var(--red); background:linear-gradient(90deg,rgba(122,0,0,.92),rgba(0,0,0,.78)); }
#osd.show { display:block; }
#osd .head { font-weight:900; text-transform:uppercase; font-size:clamp(15px,2.2vw,22px); }
#osd .num { color:var(--gold); font-style:italic; margin-right:10px; }
#osd .off { color:var(--gold); font-size:12px; letter-spacing:.1em; margin-left:8px; }
#osd .desc { color:var(--dim); font-size:13px; margin-top:3px; line-height:1.35; }
#osd .now { color:#ff8a80; font-weight:700; font-size:13px; margin-top:3px; }
#entry { position:fixed; right:14px; top:84px; z-index:4; font-size:clamp(28px,4vw,48px); font-weight:900; font-style:italic; color:var(--gold);
  text-shadow:0 3px 0 #000; font-variant-numeric:tabular-nums; }

#bar { display:flex; flex-wrap:nowrap; align-items:center; gap:6px; padding-top:6px; border-top:3px solid var(--red); }
#bar button { min-height:38px; min-width:38px; padding:0 10px; border:0; border-radius:6px; background:#2a0606; color:var(--fg);
  font-weight:900; font-size:14px; cursor:pointer; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
#bar button:hover { background:#5a0000; }
#bar button:focus, #guide header button:focus { background:#5a0000; outline:3px solid var(--gold); outline-offset:2px; }
#bar button.on { background:var(--red); color:#fff; }
#bar .ch { font-weight:900; font-style:italic; font-variant-numeric:tabular-nums; color:var(--gold); padding:0 4px; min-width:56px; text-align:center; }
#bar .gap { flex:1 1 auto; }
.foot { display:flex; justify-content:space-between; gap:12px; font-size:10px; color:#8a8a8a; }

/* guide */
#guide { position:fixed; left:0; right:0; bottom:0; z-index:8; max-height:70vh; display:flex; flex-direction:column;
  background:var(--panel); border-top:5px solid var(--red); box-shadow:0 -10px 40px rgba(225,6,0,.45);
  transform:translateY(100%); transition:transform .3s ease; }
#guide.open { transform:translateY(0); }
#guide header { display:flex; align-items:center; gap:8px; padding:10px 14px; background:linear-gradient(90deg,#e10600,#7a0000); flex-wrap:wrap; }
#guide header b { font-size:18px; font-weight:900; font-style:italic; text-transform:uppercase; letter-spacing:.05em; margin-right:auto; }
#guide header button { min-height:38px; padding:0 12px; border:2px solid #000; border-radius:6px; background:#000; color:var(--fg); font-weight:800; font-size:13px; text-transform:uppercase; cursor:pointer; }
#guide header button.on { background:var(--gold); color:#000; }
#list { overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 0 14px; }
.row { display:grid; grid-template-columns:56px 1fr auto; gap:2px 12px; padding:10px 14px; border:0; border-bottom:1px solid #2a0c0c; width:100%; text-align:left;
  background:none; color:var(--fg); cursor:pointer; }
.row:hover { background:#1f0505; outline:none; box-shadow:inset 6px 0 0 var(--red); }
.row:focus { background:#6b0a0a; outline:none; box-shadow:inset 8px 0 0 var(--gold), inset 0 0 0 2px var(--red); }
.row.on { background:linear-gradient(90deg,#5c0000,#1a0404); box-shadow:inset 6px 0 0 var(--gold); }
.row .n { grid-row:span 2; font-weight:900; font-style:italic; color:var(--gold); font-size:20px; padding-top:2px; font-variant-numeric:tabular-nums; }
.row .t { font-size:15px; font-weight:800; text-transform:uppercase; letter-spacing:.02em; }
.row .d { grid-column:2 / 4; font-size:13px; color:var(--dim); line-height:1.35; }
.row .s { font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; align-self:center; }
.s.on { color:var(--good); } .s.off { color:var(--gold); }
.now { color:#7fe0a8; font-weight:700; }

@media (max-width:620px) {
  #bar { flex-wrap:wrap; }
  #bar .gap { display:none; }
  #bar button { min-width:36px; padding:0 8px; }
  #entry { top:70px; }
}
</style>

/* EPG hook: { "<channel name>": "what is on now" }. Empty until a schedule source is added. */
window.EPG = window.EPG || {};

const $ = (id) => document.getElementById(id);
const screen_ = $("screen"), osd = $("osd"), guide = $("guide"), list = $("list");
const VERSION = "Rev15";
const APP = (navigator.userAgent.match(/RMTV\/([0-9.]+)/) || [])[1] || "";
const KEY = "tv.lastChannel", CC_KEY = "tv.cc", SKIP_KEY = "tv.skipOff";
let current = 0, previous = 0, typed = "", typeTimer = null, osdTimer = null, topTimer = null;
let started = false, volume = 1, muted = false, ccOn = true, onAirOnly = false;
let skipOn = false;
try { ccOn = localStorage.getItem(CC_KEY) !== "0"; skipOn = localStorage.getItem(SKIP_KEY) === "1"; } catch (e) {}

function playerUrl(ch) {
  const p = new URLSearchParams({ ID: ch.name.replace(/\s+/g, ""), src: ch.url, fit: "contain", muted: "0", controls: "0", cc: ccOn ? "1" : "0", reload: "0", v: VERSION });
  return "player.html?" + p.toString();
}
function nowText(ch) { return window.EPG[ch.name] || ""; }

function tune(i, { quiet = false, keepSrc = false } = {}) {
  if (!CHANNELS.length) return;
  const next = ((i % CHANNELS.length) + CHANNELS.length) % CHANNELS.length;
  if (next !== current) previous = current;
  current = next;
  const ch = CHANNELS[current];
  if (started) screen_.src = playerUrl(ch);
  try { localStorage.setItem(KEY, String(current)); } catch (e) {}
  $("chNum").textContent = "CH " + (current + 1);
  osd.innerHTML = '<div class="head"><span class="num"></span><span class="nm"></span></div>';
  osd.querySelector(".num").textContent = current + 1;
  osd.querySelector(".nm").textContent = ch.name;
  if (ch.off) { const o = document.createElement("span"); o.className = "off"; o.textContent = "OFF AIR"; osd.querySelector(".head").appendChild(o); }
  const d = document.createElement("div"); d.className = "desc"; d.textContent = ch.desc; osd.appendChild(d);
  const n = nowText(ch);
  if (n) { const x = document.createElement("div"); x.className = "now"; x.textContent = "Now: " + n; osd.appendChild(x); }
  document.title = (current + 1) + " " + ch.name + " | Red Macho Devil TV";
  $("cc").classList.toggle("on", ccOn); $("cc").setAttribute("aria-pressed", String(ccOn));
  if (!quiet) showBanner();
  markGuide();
  setStatus("Connecting", "");
  applyVolume();
}

/* Overlay: any input wakes it; 15 s later it hides again (not while the guide is open). */
const HIDE_MS = 5000;
let hideTimer = null, bannerOn = false;
function uiHidden() { return document.body.classList.contains("hideui"); }
function wake() {
  document.body.classList.remove("hideui");
  $("top").classList.remove("hide");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (!started || guide.classList.contains("open")) return wake();
    document.body.classList.add("hideui");
    osd.classList.remove("show"); bannerOn = false;
  }, HIDE_MS);
}
function showBanner() { bannerOn = true; osd.classList.add("show"); wake(); }
function toggleBanner() { if (bannerOn && !uiHidden()) { bannerOn = false; osd.classList.remove("show"); wake(); } else showBanner(); }

/* Remote control focus: Left and Right step through these buttons in order. */
const BAR_IDS = ["chDown", "chUp", "skipOff", "last", "cc", "mute", "volDown", "volUp", "info", "guideBtn", "full"];
/* only the buttons that are shown (the volume buttons are hidden inside the Fire TV app) */
function barIds() { return BAR_IDS.filter((id) => { const el = $(id); return el && el.offsetParent !== null; }); }
let barAt = 1;
function focusBar(i) {
  const ids = barIds();
  barAt = (i + ids.length) % ids.length;
  const b = $(ids[barAt]);
  if (b) b.focus();
}

    const card = d.getElementById("offline");
    const v = d.querySelector("video");
    return { card: !!card && getComputedStyle(card).display === "flex", playing: !!v && !v.paused && v.currentTime > 0 };
  } catch (e) { return null; }
}
function setStatus(text, cls) {
  const s = $("status");
  s.className = cls;
  s.querySelector("span").textContent = text;
}
function refreshStatus() {
  if (!started) return;
  const info = playerInfo();
  const ch = CHANNELS[current];
  if (!info) return setStatus("Connecting", "");
  if (info.playing) return setStatus("Live", "live");
  if (info.card) return setStatus(ch.off ? "Off air" : "No signal", ch.off ? "off" : "nosig");
  setStatus("Connecting", "");
}

/* volume and mute are set on the player's own video element (same site) */
function videos() {
  try { return Array.from(screen_.contentDocument ? screen_.contentDocument.querySelectorAll("video") : []); } catch (e) { return []; }
}
function applyVolume() {
  videos().forEach((v) => { v.volume = volume; v.muted = muted; });
  $("mute").classList.toggle("on", muted);
  $("mute").textContent = muted ? "Unmute" : "Mute";
}

function toggleMute() { muted = !muted; applyVolume(); wake(); }
function setVolume(v) {
  volume = Math.min(1, Math.max(0, Math.round(v * 20) / 20));
  if (volume > 0) muted = false;
  $("vol").value = volume;
  applyVolume();
  wake();
}

/* Network and stream stats for the top bar, read from the player page (same site). */
function streamStats() {
  try {
    const w = screen_.contentWindow, d = screen_.contentDocument;
    if (!w || !d) return "";
    const v = Array.from(d.querySelectorAll("video")).find((x) => x.readyState >= 2);
    const parts = [];
    if (v && v.videoHeight) parts.push(v.videoWidth + "\u00d7" + v.videoHeight);
    let rate = 0, link = 0;
    const players = w.videojs && w.videojs.getPlayers ? Object.values(w.videojs.getPlayers()).filter(Boolean) : [];
    players.forEach((p) => {
      try {
        const vhs = p.tech(true).vhs;
        if (!vhs) return;
        const m = vhs.playlists && vhs.playlists.media && vhs.playlists.media();
        if (m && m.attributes && m.attributes.BANDWIDTH) rate = m.attributes.BANDWIDTH;
        if (vhs.bandwidth) link = vhs.bandwidth;
      } catch (e) {}
    });
    if (rate) parts.push("stream " + (rate / 1e6).toFixed(1) + " Mb/s");
    if (link) parts.push("download " + (link / 1e6).toFixed(1) + " Mb/s");
    if (v && v.buffered && v.buffered.length) parts.push(Math.max(0, Math.round(v.buffered.end(v.buffered.length - 1) - v.currentTime)) + " s buffered");
    if (v && v.getVideoPlaybackQuality) { const q = v.getVideoPlaybackQuality(); if (q.totalVideoFrames) parts.push(q.droppedVideoFrames + " dropped"); }
    const c = navigator.connection;
    if (c && (c.effectiveType || c.downlink)) parts.push("net " + [c.effectiveType, c.downlink ? c.downlink + " Mb/s" : ""].filter(Boolean).join(" "));
    return parts.join(" \u00b7 ");
  } catch (e) { return ""; }
}
function refreshStats() { if (started && !uiHidden()) $("stats").textContent = streamStats(); }
setInterval(refreshStats, 1000);

/* short message in the middle of the screen */
let toastTimer = null;
function toast(text, ms) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), ms || 3000);
}
function toggleCC() {
  ccOn = !ccOn;
  try { localStorage.setItem(CC_KEY, ccOn ? "1" : "0"); } catch (e) {}
  tune(current, { quiet: true });
}
function nextOnAir(from, dir) {
  for (let k = 1; k <= CHANNELS.length; k++) {
    const idx = (from + dir * k + CHANNELS.length * 2) % CHANNELS.length;
    if (!CHANNELS[idx].off) return idx;
  }
  return from;
}
/* Skip off air is a setting: while it is lit, channel up and down jump over off-air channels. */
function showSkip() { $("skipOff").classList.toggle("on", skipOn); $("skipOff").setAttribute("aria-pressed", String(skipOn)); }
function toggleSkip() {
  skipOn = !skipOn;
  try { localStorage.setItem(SKIP_KEY, skipOn ? "1" : "0"); } catch (e) {}
  showSkip();
  if (skipOn && CHANNELS[current] && CHANNELS[current].off) tune(nextOnAir(current, 1));
  wake();
}
function step(dir) { tune(skipOn ? nextOnAir(current, dir) : current + dir); }

/* Back (the Fire TV app calls this): close the guide, else hide the overlay; false means leave the app. */
function hideNow() { clearTimeout(hideTimer); document.body.classList.add("hideui"); osd.classList.remove("show"); bannerOn = false; }
let exitArmedAt = 0;
window.rmtvBack = function () {
  if (guide.classList.contains("open")) { closeGuide(); wake(); return true; }
  if (started && !uiHidden()) { hideNow(); return true; }
  if (!APP) return false;
  /* leaving takes a second Back within 4 seconds */
  if (Date.now() - exitArmedAt < 4000) return false;
  exitArmedAt = Date.now();
  toast("Press Back again to exit", 4000);
  return true;
};
function lastChannel() { tune(previous); }
function toggleFull() {
  const el = document.documentElement;
  try {
    if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
    else (document.exitFullscreen || (() => {})).call(document);
  } catch (e) {}
}

/* guide */
function markGuide() {
  document.querySelectorAll(".row").forEach((r) => r.classList.toggle("on", Number(r.dataset.i) === current));
}
function buildGuide() {
  list.innerHTML = "";
  CHANNELS.forEach((ch, i) => {
    if (onAirOnly && ch.off) return;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "row";
    b.dataset.i = i;
    const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
    const t = document.createElement("span"); t.className = "t"; t.textContent = ch.name;
    const s = document.createElement("span"); s.className = "s " + (ch.off ? "off" : "on"); s.textContent = ch.off ? "Off air" : "On air";
    const d = document.createElement("span"); d.className = "d";
    const now = nowText(ch);
    d.textContent = (now ? "Now: " + now + ". " : "") + ch.desc;
    b.append(n, t, s, d);
    b.addEventListener("click", () => { tune(i); closeGuide(); });
    list.appendChild(b);
  });
  markGuide();
}
function openGuide() { guide.classList.add("open"); const on = list.querySelector(".row.on"); if (on) on.scrollIntoView({ block: "center" }); }
function closeGuide() {
  guide.classList.remove("open");
  if (document.activeElement && guide.contains(document.activeElement)) document.activeElement.blur();
}
function setTab(onAir) {
  onAirOnly = onAir;
  $("tabAll").classList.toggle("on", !onAir);
  $("tabOn").classList.toggle("on", onAir);
  buildGuide();
}

/* clock */
function tick() {
  const now = new Date();
  $("time").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = now.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
}
tick(); setInterval(tick, 15000);
setInterval(refreshStatus, 1000);
setInterval(applyVolume, 1500);

/* buttons */
$("start").addEventListener("click", () => { started = true; $("start").style.display = "none"; tune(current); wake(); });
$("chUp").addEventListener("click", () => step(1));
$("chDown").addEventListener("click", () => step(-1));
$("skipOff").addEventListener("click", toggleSkip);
$("last").addEventListener("click", lastChannel);
$("cc").addEventListener("click", toggleCC);
$("mute").addEventListener("click", toggleMute);
$("info").addEventListener("click", toggleBanner);
$("volDown").addEventListener("click", () => setVolume(volume - 0.1));
$("volUp").addEventListener("click", () => setVolume(volume + 0.1));
$("vol").addEventListener("input", (e) => setVolume(parseFloat(e.target.value)));
$("guideBtn").addEventListener("click", () => (guide.classList.contains("open") ? closeGuide() : openGuide()));
$("full").addEventListener("click", toggleFull);
$("closeGuide").addEventListener("click", closeGuide);
$("tabAll").addEventListener("click", () => setTab(false));
$("tabOn").addEventListener("click", () => setTab(true));
screen_.addEventListener("load", applyVolume);
["pointermove", "pointerdown", "touchstart"].forEach((ev) => document.addEventListener(ev, () => { if (started) wake(); }, { passive: true }));

/* keys */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { window.rmtvBack(); e.preventDefault(); return; }
  const guideOpen = guide.classList.contains("open");
  const wasHidden = uiHidden();
  if (started) wake();
  const isSelect = e.key === "Enter" || e.keyCode === 13 || e.keyCode === 23;
  if (guideOpen && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { setTab(!onAirOnly); e.preventDefault(); return; }
  if (guideOpen && isSelect) {
    const el = document.activeElement;
    if (el && guide.contains(el)) { el.click(); e.preventDefault(); }
    return;
  }
  if (!guideOpen && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    /* first press only brings the overlay back; after that it moves along the buttons */
    const onBar = barIds().indexOf(document.activeElement && document.activeElement.id);
    if (wasHidden || onBar === -1) focusBar(barAt);
    else focusBar(onBar + (e.key === "ArrowRight" ? 1 : -1));
    e.preventDefault();
    return;
  }
  if (!guideOpen && isSelect && !typed) {
    const onBar = barIds().indexOf(document.activeElement && document.activeElement.id);
    if (wasHidden || onBar === -1) focusBar(barAt);          /* show the bar, light the last used button */
    else { barAt = onBar; document.activeElement.click(); }
    e.preventDefault();
    return;
  }
  if (guideOpen && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
    /* in the guide the arrows move through the list (the browser moves the focus between rows) */
    const rows = Array.from(list.querySelectorAll(".row"));
    const at = rows.indexOf(document.activeElement);
    const next = rows[at === -1 ? 0 : Math.min(rows.length - 1, Math.max(0, at + (e.key === "ArrowDown" ? 1 : -1)))];
    if (next) next.focus();
    e.preventDefault();
    return;
  }
  if (e.key === "ArrowUp" || e.key === "PageUp") { step(1); e.preventDefault(); }
  else if (e.key === "ArrowDown" || e.key === "PageDown") { step(-1); e.preventDefault(); }
  else if (e.key === "g" || e.key === "G") { guide.classList.contains("open") ? closeGuide() : openGuide(); }
  else if (e.key === "m" || e.key === "M") { toggleMute(); }
  else if (e.key === "i" || e.key === "I") { toggleBanner(); }
  else if (!APP && (e.key === "+" || e.key === "=")) { setVolume(volume + 0.1); }
  else if (!APP && e.key === "-") { setVolume(volume - 0.1); }
  else if (e.key === "s" || e.key === "S") { toggleSkip(); }
  else if (e.key === "l" || e.key === "L") { lastChannel(); }
  else if (e.key === "c" || e.key === "C") { toggleCC(); }
  else if (e.key === "f" || e.key === "F") { toggleFull(); }
  else if (e.key === "Enter" && typed) { const n = parseInt(typed, 10); typed = ""; $("entry").textContent = ""; if (n >= 1 && n <= CHANNELS.length) tune(n - 1); }
  else if (/^[0-9]$/.test(e.key)) {
    typed = (typed + e.key).slice(-3);
    $("entry").textContent = typed;
    clearTimeout(typeTimer);
    typeTimer = setTimeout(() => { const n = parseInt(typed, 10); typed = ""; $("entry").textContent = ""; if (n >= 1 && n <= CHANNELS.length) tune(n - 1); }, 1200);
  }
});

/* swipe up or down on a phone to change channel */
let touchY = null;
document.addEventListener("touchstart", (e) => { touchY = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (touchY === null || guide.classList.contains("open")) return;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dy) > 60) step(dy < 0 ? 1 : -1);
  touchY = null;
});

/* start: last channel on this device, else the first. Sound waits for a tap. */
(function init() {
  let start = 0;
  try { start = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) {}
  current = start; previous = start;
  if (APP) document.body.classList.add("app");
  $("ver").textContent = "TV " + VERSION + (APP ? " \u00b7 App " + APP : "");
  showSkip();
  buildGuide();
  tune(start, { quiet: true });
})();
</script>
</body>
</html>
