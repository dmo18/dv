<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Wallboard v16</title>
<!--
  VERSION: bump the number in the <title> above on every change to this file,
  and add a line here (newest first).

  v16  2026-11-13  No change to the board itself; bumped so running screens reload and pick up
                   the redesigned headlines strip (Headlines Rev12).
  v15  2026-11-13  Replaced the Sky News tile with Fox News.
  v14  2026-11-12  Replaced the dead ABC8 tile with ABC News Live (24/7 channel).
  v13  2026-11-12  Relative links; tiles named by channel; stream addresses encoded
                   automatically; page reloads itself when a new version is published;
                   replaced the dead i24 stream address; dropped "demo" from the title.
  v12  2026-11-12  Repointed all tile and frame URLs from the old
                   solutionssquad.github.io/shulboard site to dmo18.github.io/dv.
  v11              Version as moved from the previous repository (earlier history not recorded).
-->

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

:root{
  --vh: 100dvh;

  --r2h: calc(100vw * 9 / 48);
  --r3h: calc(100vw * 9 / 64);
  --r4h: calc(100vw * 9 / 64);

  --r1rem: calc(var(--vh) - var(--r2h) - var(--r3h) - var(--r4h));
  --r1ah: calc(var(--r1rem) * 0.60);
  --r1bh: calc(var(--r1rem) * 0.40);
}

.grid{
  width: 100vw;
  height: var(--vh);
  display: grid;
  grid-template-rows: var(--r1ah) var(--r1bh) var(--r2h) var(--r3h) var(--r4h);
  grid-template-columns: repeat(12, 1fr);
  gap: 0;
  background: #000;
}

.tile {
  overflow: hidden;
  background: #000;
  min-width: 0;
  min-height: 0;
}

.tile iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  background: #000;
}
</style>

<script>
  // Builds a player.html link. The stream address is encoded here, so paste it in plain form.
  const player = (id, stream) =>
    "player.html?ID=" + id + "&src=" + encodeURIComponent(stream) + "&fit=contain&muted=1&reload=60";

  // One entry per tile. Links are relative, so the board works from whatever address it is served at.
  const TILES = {
    BBC:       player("BBCNews", "https://vs-cmaf-pushb-ntham-gcomm-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_world_news_north_america/pc_hd_abr_v2.fmp4.m3u8"),
    WSVN:      "wsvn.html",
    LIVENOW:   player("Livenowfox", "https://pb-k5p02dtnr2162.akamaized.net/LiveNOW_from_FOX720.m3u8"),

    IL13:      player("IL13", "https://d2xg1g9o5vns8m.cloudfront.net/out/v1/66d4ac8748ce4a9298b4e40e48d1ae2f/index.m3u8"),
    I24:       player("i24", "https://i24newsenglish-cdn.encoders.immergo.tv/master.m3u8"),
    RT:        player("RT", "https://rt-glb.rttv.com/dvr/rtnews/playlist.m3u8"),
    FOXNEWS:   player("FoxNews", "https://247preview.foxnews.com/hls/live/2020027/fncv3preview/primary.m3u8"),

    ABC10:     player("ABC10", "https://abcnews-livestreams.akamaized.net/out/v1/6a597119dbd5428a82dc11a2f514a1a2/abcn-live-10-cmaf-manifest/abcn-live-10-index_2.m3u8"),
    ABCLIVE:   player("ABCNewsLive", "https://aegis-cloudfront-1.tubi.video/d6cbb0de-68e4-4f3b-82f9-bf5d526e0bde/index.m3u8"),
    GLOBAL:    player("GlobalNews", "https://live.corusdigitaldev.com/groupd/live/49a91e7f-1023-430f-8d66-561055f3d0f7/live.isml/live-audio_1=96000-video=2499968.m3u8"),
    ALJAZEERA: player("AlJazeera", "https://live-hls-web-aje-gcp.thehlive.com/AJE/03.m3u8")
  };

  window.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("iframe[data-tile]").forEach((f) => {
      f.src = TILES[f.getAttribute("data-tile")] || "about:blank";
    });
  });

  // Self-update: every 5 minutes, fetch this page fresh and reload if its title version changed.
  const versionOf = (text) => (text.match(/<title>[^<]*\bv(\d+)/i) || [])[1];
  const RUNNING = (document.title.match(/\bv(\d+)/i) || [])[1];
  setInterval(async () => {
    try {
      const r = await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const latest = versionOf(await r.text());
      if (latest && RUNNING && latest !== RUNNING) location.reload();
    } catch (e) { /* offline or blocked: try again next time */ }
  }, 5 * 60 * 1000);
</script>
</head>

<body>
<div class="grid">
  <div class="tile" style="grid-row:1; grid-column:1 / span 12;">
    <iframe src="ticker.html"></iframe>
  </div>

  <div class="tile" style="grid-row:2; grid-column:1 / span 12;">
    <iframe src="headlines.html"></iframe>
  </div>

  <div class="tile" style="grid-row:3; grid-column:1 / span 4;"><iframe data-tile="BBC"></iframe></div>
  <div class="tile" style="grid-row:3; grid-column:5 / span 4;"><iframe data-tile="WSVN"></iframe></div>
  <div class="tile" style="grid-row:3; grid-column:9 / span 4;"><iframe data-tile="LIVENOW"></iframe></div>

  <div class="tile" style="grid-row:4; grid-column:1 / span 3;"><iframe data-tile="IL13"></iframe></div>
  <div class="tile" style="grid-row:4; grid-column:4 / span 3;"><iframe data-tile="I24"></iframe></div>
  <div class="tile" style="grid-row:4; grid-column:7 / span 3;"><iframe data-tile="RT"></iframe></div>
  <div class="tile" style="grid-row:4; grid-column:10 / span 3;"><iframe data-tile="FOXNEWS"></iframe></div>

  <div class="tile" style="grid-row:5; grid-column:1 / span 3;"><iframe data-tile="ABC10"></iframe></div>
  <div class="tile" style="grid-row:5; grid-column:4 / span 3;"><iframe data-tile="ABCLIVE"></iframe></div>
  <div class="tile" style="grid-row:5; grid-column:7 / span 3;"><iframe data-tile="GLOBAL"></iframe></div>
  <div class="tile" style="grid-row:5; grid-column:10 / span 3;"><iframe data-tile="ALJAZEERA"></iframe></div>
</div>
</body>
</html>
