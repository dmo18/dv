<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Wallboard v17</title>
<!--
  VERSION: bump the number in the <title> above on every change to this file,
  and add a line here (newest first).

  v17  2026-11-15  Channel label on every tile. Tiles that cannot play show a "No signal" card
                   instead of going black (player.html Rev5). ABC 10 falls back to CNN when
                   it is off air. LiveNOW, Global News and Al Jazeera now use
                   addresses with several quality levels, so quality matches the tile size.
                   Closed captions are shown, large and clear, on every tile whose stream carries
                   them (found while playing, so they can take a minute or two to appear).
  v16  2026-11-13  No change to the board itself; bumped so running screens reload and pick up
                   the redesigned headlines strip (Headlines Rev12).
  v15  2026-11-13  Replaced the Sky News tile with Fox News.
  v14  2026-11-12  Replaced the dead ABC8 tile with ABC News Live (24/7 channel).
  v13  2026-11-12  Relative links; tiles named by channel; stream addresses encoded
                   automatically; page reloads itself when a new version is published;
                   replaced the dead i24 stream address; dropped "demo" from the title.
  v12  2026-11-12  Repointed all tile and frame URLs from the old
                   solutionssquad.github.io/shulboard site to dmo18.github.io/dv.
  v11              Version as moved from the previous repository (earlier history not recorded).
-->

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

:root{
  --vh: 100dvh;

  --r2h: calc(100vw * 9 / 48);
  --r3h: calc(100vw * 9 / 64);
  --r4h: calc(100vw * 9 / 64);

  --r1rem: calc(var(--vh) - var(--r2h) - var(--r3h) - var(--r4h));
  --r1ah: calc(var(--r1rem) * 0.60);
  --r1bh: calc(var(--r1rem) * 0.40);
}

.grid{
  width: 100vw;
  height: var(--vh);
  display: grid;
  grid-template-rows: var(--r1ah) var(--r1bh) var(--r2h) var(--r3h) var(--r4h);
  grid-template-columns: repeat(12, 1fr);
  gap: 0;
  background: #000;
}

.tile {
  overflow: hidden;
  background: #000;
  min-width: 0;
  min-height: 0;
}

/* Label for tiles that do not use player.html (player.html draws its own, in the same style) */
.tile { position: relative; }
.tileLabel {
  position: absolute;
  top: 0;
  left: 0;
  padding: 0.35em 0.7em;
  font: 600 clamp(10px, 1.07vw, 22px) Arial, Helvetica, sans-serif;
  color: #fff;
  background: rgba(0, 0, 0, 0.6);
  border-bottom-right-radius: 0.4em;
  letter-spacing: 0.02em;
  pointer-events: none;
}

.tile iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  background: #000;
}
</style>

<script>
  // Builds a player.html link: player(ID, label shown on the tile, stream address, options).
  // Paste stream addresses in plain form; they are encoded here.
  // Options: { alt: backup stream used when the main one will not play, altLabel: its label }.
  // Use a stream's "master" address where one exists, so the player can match quality to tile size.
  const player = (id, label, stream, opts = {}) => {
    const q = new URLSearchParams({ ID: id, label, src: stream });
    if (opts.alt) { q.set("alt", opts.alt); q.set("altlabel", opts.altLabel || label); }
    q.set("fit", "contain"); q.set("muted", "1"); q.set("reload", "60");
    return "player.html?" + q.toString();
  };

  // One entry per tile. Links are relative, so the board works from whatever address it is served at.
  // Fox News is only available at low resolution (240p): keep it in a small tile.
  // ABC 10 is an event feed that goes dark between events, so it has CNN as its backup.
  // ABC 10 stays on its fixed 720p address: its lower quality level has black borders baked in.
  const TILES = {
    BBC:       player("BBCNews", "BBC News", "https://vs-cmaf-pushb-ntham-gcomm-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_world_news_north_america/pc_hd_abr_v2.fmp4.m3u8"),
    WSVN:      "wsvn.html",
    LIVENOW:   player("Livenowfox", "LiveNOW Fox", "https://pb-k5p02dtnr2162.akamaized.net/LiveNOW_from_FOX.m3u8"),

    IL13:      player("IL13", "IL13", "https://d2xg1g9o5vns8m.cloudfront.net/out/v1/66d4ac8748ce4a9298b4e40e48d1ae2f/index.m3u8"),
    I24:       player("i24", "i24", "https://i24newsenglish-cdn.encoders.immergo.tv/master.m3u8"),
    RT:        player("RT", "RT", "https://rt-glb.rttv.com/dvr/rtnews/playlist.m3u8"),
    FOXNEWS:   player("FoxNews", "Fox News", "https://247preview.foxnews.com/hls/live/2020027/fncv3preview/primary.m3u8"),

    ABC10:     player("ABC10", "ABC 10", "https://abcnews-livestreams.akamaized.net/out/v1/6a597119dbd5428a82dc11a2f514a1a2/abcn-live-10-cmaf-manifest/abcn-live-10-index_2.m3u8", { alt: "https://d2sybdl23b9psq.cloudfront.net/v1/master/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-bocx3i7bjz0dg/CNNFAST_GB.m3u8", altLabel: "CNN" }),
    ABCLIVE:   player("ABCNewsLive", "ABC News Live", "https://aegis-cloudfront-1.tubi.video/d6cbb0de-68e4-4f3b-82f9-bf5d526e0bde/index.m3u8"),
    GLOBAL:    player("GlobalNews", "Global News", "https://live.corusdigitaldev.com/groupd/live/49a91e7f-1023-430f-8d66-561055f3d0f7/live.isml/.m3u8"),
    ALJAZEERA: player("AlJazeera", "Al Jazeera", "https://live-hls-web-aje-gcp.thehlive.com/AJE/index.m3u8")
  };

  window.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("iframe[data-tile]").forEach((f) => {
      f.src = TILES[f.getAttribute("data-tile")] || "about:blank";
    });
  });

  // Self-update: every 5 minutes, fetch this page fresh and reload if its title version changed.
  const versionOf = (text) => (text.match(/<title>[^<]*\bv(\d+)/i) || [])[1];
  const RUNNING = (document.title.match(/\bv(\d+)/i) || [])[1];
  setInterval(async () => {
    try {
      const r = await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const latest = versionOf(await r.text());
      if (latest && RUNNING && latest !== RUNNING) location.reload();
    } catch (e) { /* offline or blocked: try again next time */ }
  }, 5 * 60 * 1000);
</script>
</head>

<body>
<div class="grid">
  <div class="tile" style="grid-row:1; grid-column:1 / span 12;">
    <iframe src="ticker.html"></iframe>
  </div>

  <div class="tile" style="grid-row:2; grid-column:1 / span 12;">
    <iframe src="headlines.html"></iframe>
  </div>

  <div class="tile" style="grid-row:3; grid-column:1 / span 4;"><iframe data-tile="BBC"></iframe></div>
  <div class="tile" style="grid-row:3; grid-column:5 / span 4;"><iframe data-tile="WSVN"></iframe><div class="tileLabel">WSVN 7News</div></div>
  <div class="tile" style="grid-row:3; grid-column:9 / span 4;"><iframe data-tile="LIVENOW"></iframe></div>

  <div class="tile" style="grid-row:4; grid-column:1 / span 3;"><iframe data-tile="IL13"></iframe></div>
  <div class="tile" style="grid-row:4; grid-column:4 / span 3;"><iframe data-tile="I24"></iframe></div>
  <div class="tile" style="grid-row:4; grid-column:7 / span 3;"><iframe data-tile="RT"></iframe></div>
  <div class="tile" style="grid-row:4; grid-column:10 / span 3;"><iframe data-tile="FOXNEWS"></iframe></div>

  <div class="tile" style="grid-row:5; grid-column:1 / span 3;"><iframe data-tile="ABC10"></iframe></div>
  <div class="tile" style="grid-row:5; grid-column:4 / span 3;"><iframe data-tile="ABCLIVE"></iframe></div>
  <div class="tile" style="grid-row:5; grid-column:7 / span 3;"><iframe data-tile="GLOBAL"></iframe></div>
  <div class="tile" style="grid-row:5; grid-column:10 / span 3;"><iframe data-tile="ALJAZEERA"></iframe></div>
</div>
</body>
</html>
