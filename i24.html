<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>i24 Rev4</title>
<!-- Rev 3 2026-11-16: Clappr pinned to 0.4.7 -->

<script src="https://cdn.jsdelivr.net/gh/clappr/clappr@0.4.7/dist/clappr.min.js" integrity="sha384-ajApWDNj3Fz6+mM/qWszY2lurMRRg85S7bl8oYrML7C0cXYyOc/nvor0HHG1ppqz" crossorigin="anonymous"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

#player {
  position: fixed;
  inset: 0;
  background: #000;
}

#player .clappr-player,
#player .container,
#player .player,
#player .media,
#player video {
  width: 100% !important;
  height: 100% !important;
}

#player video {
  object-fit: contain !important; /* change to cover if you want to crop instead of bars */
  background: #000;
}

#player .media-control,
#player .spinner {
  display: none !important;
}
</style>
</head>

<body>
<div id="player"></div>

<script>
var player = new Clappr.Player({
  source: "https://i24newsenglish-cdn.encoders.immergo.tv/master.m3u8",
  parentId: "#player",
  autoPlay: true,
  mute: true,
  chromeless: true,
  loop: true,
  width: "100%",
  height: "100%",
  playback: { playInline: true }
});
</script>

<div class="edu-note" style="position:fixed;right:6px;bottom:1px;font:10px/1.2 system-ui,Arial,sans-serif;color:#8a8a8a;opacity:.75;z-index:99999;pointer-events:none;letter-spacing:.02em">For educational purposes only.</div>
</body>
</html>
