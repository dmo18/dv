plugins {
    id 'com.android.application'
}

android {
    namespace 'com.redmachodevil.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.redmachodevil.tv'
        minSdk 22          // Fire OS 5 and newer
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
